<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Fuelling Plan · 2026</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 10px;
      min-height: 100vh;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: white;
      border-radius: 15px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      overflow: hidden;
    }
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px;
      text-align: center;
    }
    .header h1 {
      font-size: 2em;
      margin-bottom: 5px;
    }
    .controls {
      padding: 15px 20px;
      background: #f8f9fa;
      border-bottom: 2px solid #e9ecef;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }
    .control-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .control-group label {
      font-weight: 600;
      color: #495057;
      font-size: 0.9em;
    }
    select, input[type="text"], input[type="date"], input[type="number"], button {
      padding: 8px 12px;
      border: 1px solid #ced4da;
      border-radius: 5px;
      font-size: 14px;
    }
    select:focus, input:focus, textarea:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }
    button {
      background: #667eea;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s;
    }
    button:hover {
      background: #764ba2;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }
    button.secondary {
      background: #28a745;
    }
    button.secondary:hover {
      background: #218838;
    }
    button.warning {
      background: #dc3545;
    }
    button.warning:hover {
      background: #c82333;
    }
    button.outline {
      background: white;
      color: #6c757d;
      border: 1px solid #ced4da;
    }
    button.outline:hover {
      background: #e9ecef;
    }
    .content {
      padding: 20px;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
    }
    .stat-card {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
    }
    .stat-card.completed {
      background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
    }
    .stat-card.warning {
      background: linear-gradient(135deg, #fd7e14 0%, #ffc107 100%);
      color: #212529;
    }
    .stat-card h3 {
      font-size: 1.5em;
      margin-bottom: 5px;
    }
    .stat-card p {
      opacity: 0.9;
      font-size: 0.85em;
    }
    .run-container {
      margin-bottom: 20px;
      border: 2px solid #e9ecef;
      border-radius: 10px;
      overflow: hidden;
    }
    .run-header {
      background: #343a40;
      color: white;
      padding: 12px 15px;
      font-weight: 600;
      font-size: 0.95em;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }
    .run-header.completed {
      background: #198754;
    }
    .run-item {
      padding: 15px;
      background: white;
      display: flex;
      flex-direction: column;
      gap: 12px;
      border-top: 1px solid #e9ecef;
    }
    .mobile-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
      gap: 10px;
    }
    .mobile-main {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      font-size: 0.95em;
    }
    .mobile-full {
      grid-column: 1 / -1;
    }
    .day-badge {
      background: #667eea;
      color: white;
      padding: 6px 12px;
      border-radius: 5px;
      text-align: center;
      font-weight: 600;
      font-size: 0.85em;
      white-space: nowrap;
    }
    .day-badge.completed {
      background: #198754;
    }
    .distance {
      color: #667eea;
      font-weight: 600;
    }
    .date-display, .run-number, .food-summary, .notes-text, .carb-total {
      color: #495057;
      font-size: 0.9em;
    }
    .food-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .food-pill {
      background: #eef2ff;
      color: #4c51bf;
      border: 1px solid #c7d2fe;
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 0.82em;
      font-weight: 600;
    }
    .food-pill .qty {
      color: #343a40;
      margin-left: 4px;
    }
    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .actions button {
      flex: 1;
      min-width: 120px;
    }
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      align-items: center;
      justify-content: center;
      padding: 15px;
    }
    .modal.active {
      display: flex;
    }
    .modal-content {
      background: white;
      padding: 25px;
      border-radius: 10px;
      max-width: 760px;
      width: 100%;
      max-height: 88vh;
      overflow-y: auto;
    }
    .modal-content h2 {
      margin-bottom: 20px;
      color: #343a40;
    }
    .form-group {
      margin-bottom: 15px;
    }
    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: 600;
      color: #495057;
    }
    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ced4da;
      border-radius: 5px;
      font-size: 14px;
    }
    .form-group textarea {
      min-height: 90px;
      resize: vertical;
    }
    .food-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 12px;
      margin-top: 10px;
    }
    .food-option {
      border: 1px solid #e9ecef;
      border-radius: 8px;
      padding: 12px;
      background: #f8f9fa;
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 10px;
      align-items: center;
    }
    .food-option input[type="checkbox"] {
      width: 18px;
      height: 18px;
    }
    .food-option .food-name {
      font-weight: 600;
      color: #343a40;
      font-size: 0.92em;
    }
    .food-option .food-carbs {
      color: #6c757d;
      font-size: 0.82em;
      margin-top: 3px;
    }
    .food-option input[type="number"] {
      width: 72px;
      padding: 8px;
    }
    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
      flex-wrap: wrap;
    }
    .modal-actions button {
      flex: 1;
      min-width: 130px;
    }
    .export-section {
      margin-top: 25px;
      padding: 20px;
      background: #f8f9fa;
      border-radius: 10px;
      text-align: center;
      font-size: 0.9em;
    }
    @media (max-width: 640px) {
      .mobile-main {
        grid-template-columns: 1fr;
      }
      .mobile-header,
      .run-header {
        flex-direction: column;
        align-items: flex-start;
      }
      .actions button,
      .modal-actions button {
        min-width: 100%;
      }
      .food-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🍜 2026 Fuelling Plan</h1>
      <p style="font-size:0.9em; margin-top:10px;">Match fuelling to each run · edit any time · carbs tracked per session</p>
    </div>

    <div class="controls">
      <div class="control-group">
        <label for="dayFilter">Day:</label>
        <select id="dayFilter">
          <option value="all">All</option>
        </select>
      </div>
      <div class="control-group">
        <label for="foodFilter">Food:</label>
        <select id="foodFilter">
          <option value="all">All</option>
        </select>
      </div>
      <div class="control-group">
        <label for="searchBox">Search:</label>
        <input type="text" id="searchBox" placeholder="Search run, note, food...">
      </div>
      <div class="control-group">
        <input type="checkbox" id="showCompleted" checked>
        <label for="showCompleted">Show completed runs</label>
      </div>
      <button onclick="resetFilters()">Reset</button>
      <button class="secondary" onclick="exportToCSV()">📥 CSV</button>
    </div>

    <div class="content">
      <div class="stats" id="statsContainer"></div>
      <div id="runsContainer"></div>
      <div class="export-section">
        <h3>✅ Fuelling planner ready</h3>
        <p>Day · Date · Distance · Run number · food selections · editable carb totals</p>
      </div>
    </div>
  </div>

  <div id="editModal" class="modal">
    <div class="modal-content">
      <h2>Edit Fuelling Plan</h2>
      <form id="editForm">
        <div class="form-group">
          <label for="editDay">Day</label>
          <input type="text" id="editDay" readonly>
        </div>
        <div class="form-group">
          <label for="editDate">Date</label>
          <input type="text" id="editDate" readonly>
        </div>
        <div class="form-group">
          <label for="editDistance">Distance</label>
          <input type="text" id="editDistance" readonly>
        </div>
        <div class="form-group">
          <label for="editRunNumber">Run number</label>
          <input type="text" id="editRunNumber" readonly>
        </div>
        <div class="form-group">
          <label>Food selections</label>
          <div id="foodOptions" class="food-grid"></div>
        </div>
        <div class="form-group">
          <label for="editNotes">Fuelling notes</label>
          <textarea id="editNotes" placeholder="Add notes, timing, or anything you want to test..."></textarea>
        </div>
        <div class="form-group">
          <label for="editTotalCarbs">Total planned carbs (g)</label>
          <input type="text" id="editTotalCarbs" readonly>
        </div>
        <div class="modal-actions">
          <button type="submit">Save</button>
          <button type="button" class="warning" onclick="clearFoods()">Clear food</button>
          <button type="button" onclick="closeModal()">Cancel</button>
        </div>
      </form>
    </div>
  </div>

    const foodCatalogue = [
      { id: 'naak-salted-soup', name: 'Näak Salted Soup', carbs: 55 },
      { id: 'naak-energy-drink', name: 'Näak Energy Drink (500ml)', carbs: 55 },
      { id: 'aldi-bagel-pastrami', name: 'Aldi Bagel with Pastrami & Pickle', carbs: 44 },
      { id: 'aldi-bagel-bovril', name: 'Aldi Bagel with Bovril & Dairylea', carbs: 44 },
      { id: 'running-gel', name: 'Running Gel (1:0.8 mix)', carbs: 40 },
      { id: 'running-flapjack', name: 'Running Flapjack', carbs: 40 },
      { id: 'sweets', name: 'Sweets (per portion)', carbs: 40 },
      { id: 'precision-fuel-chews', name: 'Precision Fuel Chews', carbs: 30 },
      { id: 'kmc-mint-gel', name: 'KMC Mint Gel', carbs: 27 },
      { id: 'Running-puree', name: 'Running Puree', carbs: 26 },
      { id: 'naak-waffles', name: 'Näak Waffles', carbs: 17 },
      { id: 'single-bounty-bar', name: 'Single Bounty Bar (1 piece)', carbs: 17 }
      { id: 'Running Tiffin', name: 'Running Tiffin', carbs:40},
    ];

    const storageKey = 'fuellingPlan2026_v1';
    let currentEditIndex = null;

    const savedFuelling = (() => {
      try {
        return JSON.parse(localStorage.getItem(storageKey) || '{}');
      } catch (e) {
        return {};
      }
    })();

    let fuellingData = baseRunsData.map(run => {
      const saved = savedFuelling[run.Run] || {};
      return {
        ...run,
        foods: Array.isArray(saved.foods) ? saved.foods : [],
        notes: saved.notes || '',
        completed: !!saved.completed
      };
    });

    function getFoodById(id) {
      return foodCatalogue.find(food => food.id === id);
    }

    function calculateTotalCarbs(run) {
      return run.foods.reduce((sum, item) => {
        const food = getFoodById(item.id);
        return sum + (food ? food.carbs * (item.qty || 0) : 0);
      }, 0);
    }

    function saveFuellingData() {
      const payload = {};
      fuellingData.forEach(run => {
        payload[run.Run] = {
          foods: run.foods,
          notes: run.notes,
          completed: !!run.completed
        };
      });
      localStorage.setItem(storageKey, JSON.stringify(payload));
    }

    function populateFilters() {
      const dayFilter = document.getElementById('dayFilter');
      const foodFilter = document.getElementById('foodFilter');
      const days = [...new Set(fuellingData.map(run => run.Day))];
      days.forEach(day => {
        const option = document.createElement('option');
        option.value = day;
        option.textContent = day;
        dayFilter.appendChild(option);
      });
      foodCatalogue.forEach(food => {
        const option = document.createElement('option');
        option.value = food.id;
        option.textContent = food.name;
        foodFilter.appendChild(option);
      });
    }

    function updateStats() {
      const totalRuns = fuellingData.length;
      const visibleRuns = fuellingData.filter(run => !run.completed).length;
      const plannedRuns = fuellingData.filter(run => (run.foods.length > 0 || run.notes.trim()) && !run.completed).length;
      const totalCarbs = fuellingData.reduce((sum, run) => sum + calculateTotalCarbs(run), 0);
      const averageCarbs = plannedRuns ? (totalCarbs / plannedRuns).toFixed(0) : 0;
      const highFuelRuns = fuellingData.filter(run => calculateTotalCarbs(run) >= 80 && !run.completed).length;
      const completedRuns = fuellingData.filter(run => run.completed).length;

      document.getElementById('statsContainer').innerHTML = `
        <div class="stat-card"><h3>${totalRuns}</h3><p>Total runs</p></div>
        <div class="stat-card completed"><h3>${plannedRuns}</h3><p>Planned & visible runs</p></div>
        <div class="stat-card"><h3>${visibleRuns}</h3><p>Visible runs (not completed)</p></div>
        <div class="stat-card warning"><h3>${averageCarbs}g</h3><p>Avg per planned visible run</p></div>
        <div class="stat-card"><h3>${highFuelRuns}</h3><p>80g+ visible runs</p></div>
        <div class="stat-card completed"><h3>${completedRuns}</h3><p>Completed runs</p></div>
      `;
    }

    function renderRuns() {
      const dayFilter = document.getElementById('dayFilter').value;
      const foodFilter = document.getElementById('foodFilter').value;
      const search = document.getElementById('searchBox').value.toLowerCase();
      const showCompleted = document.getElementById('showCompleted').checked;

      let filtered = fuellingData.filter(run => {
        if (!showCompleted && run.completed) return false;
        if (dayFilter !== 'all' && run.Day !== dayFilter) return false;
        if (foodFilter !== 'all' && !run.foods.some(item => item.id === foodFilter && item.qty > 0)) return false;
        if (search) {
          const foodNames = run.foods.map(item => getFoodById(item.id)?.name || '').join(' ');
          const haystack = `${run.Run} ${run.Day} ${run.Date} ${run.Distance_km} ${run.Type} ${run.notes} ${foodNames}`.toLowerCase();
          if (!haystack.includes(search)) return false;
        }
        return true;
      });

      const container = document.getElementById('runsContainer');
      container.innerHTML = '';

      filtered.forEach(run => {
        const miles = (run.Distance_km * 0.621371).toFixed(1);
        const totalCarbs = calculateTotalCarbs(run);
        const selectedFoods = run.foods
          .filter(item => item.qty > 0)
          .map(item => {
            const food = getFoodById(item.id);
            return food ? `<span class="food-pill">${food.name}<span class="qty">×${item.qty}</span></span>` : '';
          })
          .join('');

        const wrapper = document.createElement('div');
        wrapper.className = 'run-container';
        wrapper.innerHTML = `
          <div class="run-header ${run.completed ? 'completed' : ''}">
            <span>${run.completed ? '✅ ' : ''}Run ${run.Run} • ${run.Type}</span>
            <span>${totalCarbs}g planned carbs</span>
          </div>
          <div class="run-item">
            <div class="mobile-header">
              <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
                <span class="day-badge ${run.completed ? 'completed' : ''}">${run.Day}</span>
                <span class="run-number">Run number: ${run.Run}</span>
              </div>
              <span class="date-display">${run.Date}</span>
            </div>
            <div class="mobile-main">
              <div><div class="distance">${run.Distance_km}km (${miles}mi)</div></div>
              <div><div class="carb-total">Planned carbs: ${totalCarbs}g</div></div>
            </div>
            <div class="mobile-full">
              <div class="food-summary">${selectedFoods || '<span style="color:#6c757d;">No food selected yet</span>'}</div>
            </div>
            <div class="mobile-full">
              <div class="notes-text">${run.notes ? run.notes : '<span style="color:#6c757d;">No fuelling notes added</span>'}</div>
            </div>
            <div class="actions">
              <button class="secondary" onclick="editRun(${run.Run})">✏️ Edit fuelling</button>
              <button class="outline" onclick="toggleCompleted(${run.Run})">
                ${run.completed ? '↩️ Undo complete' : '✅ Mark complete & hide'}
              </button>
            </div>
          </div>
        `;
        container.appendChild(wrapper);
      });

      if (!filtered.length) {
        container.innerHTML = '<div class="run-container"><div class="run-item"><div class="notes-text">No runs match the current filter.</div></div></div>';
      }

      updateStats();
    }

    function buildFoodOptions(run) {
      const foodOptions = document.getElementById('foodOptions');
      foodOptions.innerHTML = foodCatalogue.map(food => {
        const selected = run.foods.find(item => item.id === food.id);
        const qty = selected?.qty || 0;
        return `
          <div class="food-option">
            <input type="checkbox" id="food-${food.id}" data-food-id="${food.id}" ${qty > 0 ? 'checked' : ''} onchange="toggleFoodQty('${food.id}')">
            <label for="food-${food.id}">
              <div class="food-name">${food.name}</div>
              <div class="food-carbs">${food.carbs}g carbs each</div>
            </label>
            <input type="number" min="1" step="1" value="${qty > 0 ? qty : 1}" id="qty-${food.id}" ${qty > 0 ? '' : 'disabled'} oninput="updateModalCarbs()">
          </div>
        `;
      }).join('');
      updateModalCarbs();
    }

    function toggleFoodQty(foodId) {
      const checkbox = document.getElementById(`food-${foodId}`);
      const qtyInput = document.getElementById(`qty-${foodId}`);
      qtyInput.disabled = !checkbox.checked;
      if (checkbox.checked && (!qtyInput.value || Number(qtyInput.value) < 1)) qtyInput.value = 1;
      updateModalCarbs();
    }

    function updateModalCarbs() {
      let total = 0;
      foodCatalogue.forEach(food => {
        const checkbox = document.getElementById(`food-${food.id}`);
        const qtyInput = document.getElementById(`qty-${food.id}`);
        if (checkbox && qtyInput && checkbox.checked) {
          total += food.carbs * Math.max(1, Number(qtyInput.value || 1));
        }
      });
      document.getElementById('editTotalCarbs').value = `${total}g`;
    }

    function editRun(runNumber) {
      const run = fuellingData.find(item => item.Run === runNumber);
      currentEditIndex = fuellingData.findIndex(item => item.Run === runNumber);
      document.getElementById('editDay').value = run.Day;
      document.getElementById('editDate').value = run.Date;
      document.getElementById('editDistance').value = `${run.Distance_km}km`;
      document.getElementById('editRunNumber').value = run.Run;
      document.getElementById('editNotes').value = run.notes || '';
      buildFoodOptions(run);
      document.getElementById('editModal').classList.add('active');
    }

    function clearFoods() {
      foodCatalogue.forEach(food => {
        const checkbox = document.getElementById(`food-${food.id}`);
        const qtyInput = document.getElementById(`qty-${food.id}`);
        if (checkbox) checkbox.checked = false;
        if (qtyInput) {
          qtyInput.disabled = true;
          qtyInput.value = 1;
        }
      });
      updateModalCarbs();
    }

    function closeModal() {
      document.getElementById('editModal').classList.remove('active');
      currentEditIndex = null;
    }

    function toggleCompleted(runNumber) {
      const idx = fuellingData.findIndex(r => r.Run === runNumber);
      if (idx === -1) return;
      fuellingData[idx].completed = !fuellingData[idx].completed;
      saveFuellingData();
      renderRuns();
    }

    document.getElementById('editForm').addEventListener('submit', function(e) {
      e.preventDefault();
      if (currentEditIndex === null) return;

      const selectedFoods = foodCatalogue
        .map(food => {
          const checkbox = document.getElementById(`food-${food.id}`);
          const qtyInput = document.getElementById(`qty-${food.id}`);
          return checkbox && checkbox.checked ? { id: food.id, qty: Math.max(1, Number(qtyInput.value || 1)) } : null;
        })
        .filter(Boolean);

      fuellingData[currentEditIndex].foods = selectedFoods;
      fuellingData[currentEditIndex].notes = document.getElementById('editNotes').value.trim();
      saveFuellingData();
      renderRuns();
      closeModal();
    });

    function resetFilters() {
      document.getElementById('dayFilter').value = 'all';
      document.getElementById('foodFilter').value = 'all';
      document.getElementById('searchBox').value = '';
      document.getElementById('showCompleted').checked = true;
      renderRuns();
    }

    function exportToCSV() {
      const rows = fuellingData.map(run => {
        const foods = run.foods
          .filter(item => item.qty > 0)
          .map(item => {
            const food = getFoodById(item.id);
            return food ? `${food.name} x${item.qty}` : '';
          })
          .filter(Boolean)
          .join(' | ');
        return {
          Day: run.Day,
          Date: run.Date,
          Distance_km: run.Distance_km,
          Run_number: run.Run,
          Run_type: run.Type,
          Foods: foods,
          Total_carbs_g: calculateTotalCarbs(run),
          Notes: run.notes,
          Completed: run.completed ? 'Yes' : 'No'
        };
      });

      const headers = Object.keys(rows[0]);
      const csv = [
        headers.join(','),
        ...rows.map(row => headers.map(header => {
          const value = String(row[header] ?? '');
          return /[",\n]/.test(value) ? `"${value.replace(/"/g, '""')}"` : value;
        }).join(','))
      ].join('\n');

      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = 'fuelling_plan_2026.csv';
      link.click();
      URL.revokeObjectURL(url);
    }

    document.getElementById('dayFilter').addEventListener('change', renderRuns);
    document.getElementById('foodFilter').addEventListener('change', renderRuns);
    document.getElementById('searchBox').addEventListener('input', renderRuns);
    document.getElementById('showCompleted').addEventListener('change', renderRuns);
    document.getElementById('editModal').addEventListener('click', function(e) {
      if (e.target === this) closeModal();
    });

    window.onload = function() {
      populateFilters();
      renderRuns();
    };
  </script>
</body>
</html>
