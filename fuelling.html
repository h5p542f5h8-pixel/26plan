<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Fuelling Plan · 2026</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 10px;
      min-height: 100vh;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: white;
      border-radius: 15px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      overflow: hidden;
    }
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px;
      text-align: center;
    }
    .header h1 {
      font-size: 2em;
      margin-bottom: 5px;
    }
    .controls {
      padding: 15px 20px;
      background: #f8f9fa;
      border-bottom: 2px solid #e9ecef;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }
    .control-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .control-group label {
      font-weight: 600;
      color: #495057;
      font-size: 0.9em;
    }
    select, input[type="text"], input[type="number"], button {
      padding: 8px 12px;
      border: 1px solid #ced4da;
      border-radius: 5px;
      font-size: 14px;
    }
    select:focus, input:focus, textarea:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }
    button {
      background: #667eea;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s;
    }
    button:hover {
      background: #764ba2;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }
    button.secondary {
      background: #28a745;
    }
    button.secondary:hover {
      background: #218838;
    }
    button.warning {
      background: #dc3545;
    }
    button.warning:hover {
      background: #c82333;
    }
    button.outline {
      background: white;
      color: #6c757d;
      border: 1px solid #ced4da;
    }
    button.outline:hover {
      background: #e9ecef;
    }
    .content {
      padding: 20px;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
    }
    .stat-card {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
    }
    .stat-card.completed {
      background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
    }
    .stat-card.warning {
      background: linear-gradient(135deg, #fd7e14 0%, #ffc107 100%);
      color: #212529;
    }
    .stat-card h3 {
      font-size: 1.5em;
      margin-bottom: 5px;
    }
    .stat-card p {
      opacity: 0.9;
      font-size: 0.85em;
    }
    .run-container {
      margin-bottom: 20px;
      border: 2px solid #e9ecef;
      border-radius: 10px;
      overflow: hidden;
    }
    .run-header {
      background: #343a40;
      color: white;
      padding: 12px 15px;
      font-weight: 600;
      font-size: 0.95em;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }
    .run-header.completed {
      background: #198754;
    }
    .run-item {
      padding: 15px;
      background: white;
      display: flex;
      flex-direction: column;
      gap: 12px;
      border-top: 1px solid #e9ecef;
    }
    .mobile-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
      gap: 10px;
    }
    .mobile-main {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      font-size: 0.95em;
    }
    .mobile-full {
      grid-column: 1 / -1;
    }
    .day-badge {
      background: #667eea;
      color: white;
      padding: 6px 12px;
      border-radius: 5px;
      text-align: center;
      font-weight: 600;
      font-size: 0.85em;
      white-space: nowrap;
    }
    .day-badge.completed {
      background: #198754;
    }
    .distance {
      color: #667eea;
      font-weight: 600;
    }
    .date-display, .run-number, .food-summary, .notes-text, .carb-total {
      color: #495057;
      font-size: 0.9em;
    }
    .carb-total span {
      font-weight: 600;
    }
    .carb-total.under {
      color: #fd7e14;
    }
    .carb-total.good {
      color: #198754;
    }
    .food-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .food-pill {
      background: #eef2ff;
      color: #4c51bf;
      border: 1px solid #c7d2fe;
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 0.82em;
      font-weight: 600;
    }
    .food-pill .qty {
      color: #343a40;
      margin-left: 4px;
    }
    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .actions button {
      flex: 1;
      min-width: 120px;
    }
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      align-items: center;
      justify-content: center;
      padding: 15px;
    }
    .modal.active {
      display: flex;
    }
    .modal-content {
      background: white;
      padding: 25px;
      border-radius: 10px;
      max-width: 760px;
      width: 100%;
      max-height: 88vh;
      overflow-y: auto;
    }
    .modal-content h2 {
      margin-bottom: 20px;
      color: #343a40;
    }
    .form-group {
      margin-bottom: 15px;
    }
    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: 600;
      color: #495057;
    }
    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ced4da;
      border-radius: 5px;
      font-size: 14px;
    }
    .form-group textarea {
      min-height: 90px;
      resize: vertical;
    }
    .food-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 12px;
      margin-top: 10px;
    }
    .food-option {
      border: 1px solid #e9ecef;
      border-radius: 8px;
      padding: 12px;
      background: #f8f9fa;
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 10px;
      align-items: center;
    }
    .food-option input[type="checkbox"] {
      width: 18px;
      height: 18px;
    }
    .food-option .food-name {
      font-weight: 600;
      color: #343a40;
      font-size: 0.92em;
    }
    .food-option .food-carbs {
      color: #6c757d;
      font-size: 0.82em;
      margin-top: 3px;
    }
    .food-option input[type="number"] {
      width: 72px;
      padding: 8px;
    }
    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
      flex-wrap: wrap;
    }
    .modal-actions button {
      flex: 1;
      min-width: 130px;
    }
    .export-section {
      margin-top: 25px;
      padding: 20px;
      background: #f8f9fa;
      border-radius: 10px;
      text-align: center;
      font-size: 0.9em;
    }
    @media (max-width: 640px) {
      .mobile-main {
        grid-template-columns: 1fr;
      }
      .mobile-header,
      .run-header {
        flex-direction: column;
        align-items: flex-start;
      }
      .actions button,
      .modal-actions button {
        min-width: 100%;
      }
      .food-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🍜 2026 Fuelling Plan</h1>
      <p style="font-size:0.9em; margin-top:10px;">120 g/hour fuelling targets per run</p>
    </div>

    <div class="controls">
      <div class="control-group">
        <label for="dayFilter">Day:</label>
        <select id="dayFilter">
          <option value="all">All</option>
        </select>
      </div>
      <div class="control-group">
        <label for="foodFilter">Food:</label>
        <select id="foodFilter">
          <option value="all">All</option>
        </select>
      </div>
      <div class="control-group">
        <label for="searchBox">Search:</label>
        <input type="text" id="searchBox" placeholder="Search run, note, food...">
      </div>
      <div class="control-group">
        <input type="checkbox" id="showCompleted" checked>
        <label for="showCompleted">Show completed runs</label>
      </div>
      <button onclick="resetFilters()">Reset</button>
      <button class="secondary" onclick="exportToCSV()">📥 CSV</button>
    </div>

    <div class="content">
      <div class="stats" id="statsContainer"></div>
      <div id="runsContainer"></div>
      <div class="export-section">
        <h3>✅ 120 g/hour targets applied</h3>
        <p>Enter planned minutes per run to see target vs planned carbs</p>
      </div>
    </div>
  </div>

  <div id="editModal" class="modal">
    <div class="modal-content">
      <h2>Edit Fuelling Plan</h2>
      <form id="editForm">
        <div class="form-group">
          <label for="editDay">Day</label>
          <input type="text" id="editDay" readonly>
        </div>
        <div class="form-group">
          <label for="editDate">Date</label>
          <input type="text" id="editDate" readonly>
        </div>
        <div class="form-group">
          <label for="editDistance">Distance</label>
          <input type="text" id="editDistance" readonly>
        </div>
        <div class="form-group">
          <label for="editRunNumber">Run number</label>
          <input type="text" id="editRunNumber" readonly>
        </div>
        <div class="form-group">
          <label for="editPlannedMinutes">Planned time (minutes)</label>
          <input type="number" id="editPlannedMinutes" min="0" step="1" placeholder="e.g. 180 for 3 hours">
        </div>
        <div class="form-group">
          <label>Food selections</label>
          <div id="foodOptions" class="food-grid"></div>
        </div>
        <div class="form-group">
          <label for="editNotes">Fuelling notes</label>
          <textarea id="editNotes" placeholder="Add notes, timing, or anything you want to test..."></textarea>
        </div>
        <div class="form-group">
          <label for="editTotalCarbs">Total planned carbs (g)</label>
          <input type="text" id="editTotalCarbs" readonly>
        </div>
        <div class="form-group">
          <label for="editTargetCarbs">Target at 120 g/h (g)</label>
          <input type="text" id="editTargetCarbs" readonly>
        </div>
        <div class="modal-actions">
          <button type="submit">Save</button>
          <button type="button" class="warning" onclick="clearFoods()">Clear food</button>
          <button type="button" onclick="closeModal()">Cancel</button>
        </div>
      </form>
    </div>
  </div>
