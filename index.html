<html lang="en">
<head>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 10px;
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 2em;
            margin-bottom: 5px;
        }

        .controls {
            padding: 15px 20px;
            background: #f8f9fa;
            border-bottom: 2px solid #e9ecef;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-group label {
            font-weight: 600;
            color: #495057;
            font-size: 0.9em;
        }

        select, input[type="text"], button {
            padding: 8px 12px;
            border: 1px solid #ced4da;
            border-radius: 5px;
            font-size: 14px;
        }

        select:focus, input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        button {
            background: #667eea;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        button:hover {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        button.secondary {
            background: #28a745;
        }

        button.secondary:hover {
            background: #218838;
        }

        .content {
            padding: 20px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-card.completed {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
        }

        .stat-card h3 {
            font-size: 1.5em;
            margin-bottom: 5px;
        }

        .stat-card p {
            opacity: 0.9;
            font-size: 0.85em;
        }

        .week-container {
            margin-bottom: 25px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            overflow: hidden;
        }

        .week-header {
            background: #343a40;
            color: white;
            padding: 12px 15px;
            font-weight: 600;
            font-size: 0.95em;
        }

        .runs-list {
            background: white;
        }

        .run-item {
            padding: 15px;
            border-bottom: 1px solid #e9ecef;
            display: flex;
            flex-direction: column;
            gap: 10px;
            cursor: move;
            transition: all 0.3s;
        }

        .run-item.completed {
            opacity: 0.6;
            background: #e8f5e9;
        }

        .run-item:hover {
            background: #f8f9fa;
        }

        .run-item.completed:hover {
            background: #c8e6c9;
        }

        .run-item.dragging {
            opacity: 0.5;
            background: #e9ecef;
        }

        .run-item.drag-over {
            border-top: 3px solid #667eea;
        }

        .run-item:last-child {
            border-bottom: none;
        }

        .run-item.race {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
        }

        .run-item.race:hover {
            background: #ffeaa7;
        }

        .run-item.race.completed {
            background: #fffacd;
        }

        .mobile-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
        }

        .mobile-main {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            font-size: 0.95em;
        }

        .mobile-full {
            grid-column: 1 / -1;
        }

        .day-badge {
            background: #667eea;
            color: white;
            padding: 6px 12px;
            border-radius: 5px;
            text-align: center;
            font-weight: 600;
            font-size: 0.85em;
            white-space: nowrap;
        }

        .distance {
            color: #667eea;
            font-weight: 600;
        }

        .pace {
            color: #6c757d;
            font-size: 0.85em;
        }

        .estimated-time {
            color: #ff6b6b;
            font-weight: 600;
            font-size: 0.85em;
        }

        .notes {
            color: #495057;
            font-size: 0.85em;
            line-height: 1.4;
        }

        .terrain {
            color: #6c757d;
            font-size: 0.8em;
        }

        .date-display {
            color: #495057;
            font-size: 0.85em;
        }

        .actions {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }

        .actions button {
            padding: 5px 10px;
            font-size: 0.85em;
            flex: 1;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 10px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-content h2 {
            margin-bottom: 20px;
            color: #343a40;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #495057;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ced4da;
            border-radius: 5px;
            font-size: 14px;
        }

        .form-group textarea {
            min-height: 80px;
            resize: vertical;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-actions button {
            flex: 1;
        }

        .export-section {
            margin-top: 25px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            text-align: center;
            font-size: 0.9em;
        }
    </style>
</head>

        </div>

        <div class="controls">

            </div>

            <button class="secondary" onclick="toggleShowCompleted()" id="toggleBtn">🙈 Hide</button>
            <button class="secondary" onclick="exportToCSV()">📥 CSV</button>

        <div class="content">

            </div>
        </div>
    </div>

    <div id="editModal" class="modal">

            <h2>Edit Run</h2>
            <form id="editForm">
                <div class="form-group">
                    <label>Day of Week:</label>
                    <select id="editDay">
                        <option value="Mon">Monday</option>
                        <option value="Tue">Tuesday</option>
                        <option value="Wed">Wednesday</option>
                        <option value="Thu">Thursday</option>
                        <option value="Fri">Friday</option>
                        <option value="Sat">Saturday</option>
                        <option value="Sun">Sunday</option>

                </div>
                <div class="form-group">
                    <label>Date (DD/MM/YYYY):</label>
                    <input type="text" id="editDate" placeholder="DD/MM/YYYY">
                </div>
                <div class="form-group">
                    <label>Run Type:</label>
                    <input type="text" id="editType">
                </div>
                <div class="form-group">
                    <label>Distance (km):</label>
                    <input type="number" id="editDistance" step="any" min="0">
                </div>
                <div class="form-group">
                    <label>Pace:</label>
                    <input type="text" id="editPace" placeholder="e.g., 6:15-6:50/km">
                </div>
                <div class="form-group">
                    <label>Terrain:</label>
                    <input type="text" id="editTerrain">
                </div>
                <div class="form-group">
                    <label>Notes:</label>
                    <textarea id="editNotes"></textarea>
                </div>
                <div class="modal-actions">
                    <button type="submit" class="secondary">Save</button>
                    <button type="button" onclick="closeModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

        let trainingData = freshRunsData.map(run => ({...run, completed: false}));
        const savedData = localStorage.getItem('trainingPlanDEV_v2');
        if (savedData) {
            try {
                const saved = JSON.parse(savedData);
                if (Array.isArray(saved) && saved.length === trainingData.length) {
                    saved.forEach((s, i) => { if(s?.completed) trainingData[i].completed = true; });
                }
            } catch(e) {}
        }

        let currentEditIndex = null, draggedIndex = null, showCompleted = false;

        // Parse pace string and calculate estimated time using SLOWEST pace
        function estimateRunTime(distance, pace) {
            if (!pace || !distance) return null;
            
            // Extract all time values from pace (handles ranges like "6:15-6:50/km" or single pace like "5:12/km")
            const paceMatches = pace.match(/(\d+):(\d+)/g);
            if (!paceMatches || paceMatches.length === 0) return null;
            
            // Parse all pace values
            const paces = paceMatches.map(match => {
                const parts = match.split(':');
                const minutes = parseInt(parts[0]);
                const seconds = parseInt(parts[1]);
                return minutes + (seconds / 60);
            });
            
            // Use slowest pace (maximum value) for conservative estimation
            const slowestPace = Math.max(...paces);
            
            const totalMinutes = distance * slowestPace;
            const hours = Math.floor(totalMinutes / 60);
            const mins = Math.round(totalMinutes % 60);
            
            if (hours === 0) return `${mins}m`;
            if (mins === 0) return `${hours}h`;
            return `${hours}h ${mins}m`;
        }

        function toggleShowCompleted() {
            showCompleted = !showCompleted;
            document.getElementById('toggleBtn').textContent = showCompleted ? '👁️ Show' : '🙈 Hide';
            renderWeeks();
        }

        function markComplete(i) { trainingData[i].completed = true; saveToLocalStorage(); renderWeeks(); updateStats(); }
        function markIncomplete(i) { trainingData[i].completed = false; saveToLocalStorage(); renderWeeks(); updateStats(); }

        function saveToLocalStorage() { 
            localStorage.setItem('trainingPlanDEV_v2', JSON.stringify(trainingData.map(({completed}) => ({completed}))));
        }

        function updateStats() {
            const total = trainingData.length;
            const completed = trainingData.filter(r => r.completed).length;
            const totalDist = trainingData.reduce((s, r) => s + (parseFloat(r.Distance_km) || 0), 0);
            const compDist = trainingData.filter(r => r.completed).reduce((s, r) => s + (parseFloat(r.Distance_km) || 0), 0);
            const races = trainingData.filter(r => r.Type === 'Race').length;
            
            document.getElementById('statsContainer').innerHTML = `
                <div class="stat-card"><h3>${total}</h3><p>Total</p></div>
                <div class="stat-card completed"><h3>${completed}</h3><p>Done ✅</p></div>
                <div class="stat-card"><h3>${(total - completed)}</h3><p>Left</p></div>
                <div class="stat-card"><h3>${totalDist.toFixed(0)}km</h3><p>Total</p></div>
                <div class="stat-card completed"><h3>${compDist.toFixed(0)}km</h3><p>Done</p></div>
                <div class="stat-card"><h3>${races}</h3><p>Races</p></div>
            `;
        }

        function populateFilters() {
            const phases = [...new Set(trainingData.map(r => r.Phase))];
            const types = [...new Set(trainingData.map(r => r.Type))];
            const pf = document.getElementById('phaseFilter');
            const tf = document.getElementById('typeFilter');
            phases.forEach(p => { const o = document.createElement('option'); o.value = p; o.textContent = p; pf.appendChild(o); });
            types.forEach(t => { const o = document.createElement('option'); o.value = t; o.textContent = t; tf.appendChild(o); });
        }

        function renderWeeks() {
            const pf = document.getElementById('phaseFilter').value;
            const tf = document.getElementById('typeFilter').value;
            const search = document.getElementById('searchBox').value.toLowerCase();
            let filtered = trainingData.filter(r => showCompleted || !r.completed);
            if(pf !== 'all') filtered = filtered.filter(r => r.Phase === pf);
            if(tf !== 'all') filtered = filtered.filter(r => r.Type === tf);
            if(search) filtered = filtered.filter(r => JSON.stringify(r).toLowerCase().includes(search));
            
            const wg = {};
            filtered.forEach(run => { 
                if(!wg[run.Week]) wg[run.Week] = []; 
                wg[run.Week].push({...run, idx: trainingData.indexOf(run)});
            });
            
            const c = document.getElementById('weeksContainer');
            c.innerHTML = '';
            Object.keys(wg).sort((a,b) => a-b).forEach(w => {
                const runs = wg[w];
                const div = document.createElement('div');
                div.className = 'week-container';
                const wdist = runs.reduce((s, r) => s + (parseFloat(r.Distance_km) || 0), 0);
                const wcomp = runs.filter(r => r.completed).length;
                div.innerHTML = `<div class="week-header">Week ${w} • ${wdist.toFixed(0)}km${wcomp > 0 ? ` • ${wcomp} done` : ''}</div><div class="runs-list">${runs.map(r => {
                    const mi = (r.Distance_km * 0.621371).toFixed(1);
                    const estTime = estimateRunTime(r.Distance_km, r.Pace);
                    const isR = r.Type === 'Race';
                    const isC = r.completed;
                    return `<div class="run-item ${isR ? 'race' : ''} ${isC ? 'completed' : ''}" draggable="true" data-index="${r.idx}" ondragstart="dragStart(event)" ondrop="drop(event)" ondragover="dragOver(event)" ondragend="dragEnd(event)">
                        <div class="mobile-header">
                            <div style="display:flex; gap:8px; align-items:center;">
                                <span class="day-badge">${r.Day}</span>
                                <span style="font-weight:600;">${r.Type}</span>
                            </div>
                            <span class="date-display">${r.Date}</span>
                        </div>
                        <div class="mobile-main">
                            <div><div class="distance">${r.Distance_km}km (${mi}mi)</div></div>
                            <div><div class="pace">${r.Pace || '-'}</div></div>
                        </div>
                        ${estTime ? `<div class="mobile-full"><div class="estimated-time">⏱️ Est. ${estTime}</div></div>` : ''}
                        <div class="mobile-full"><div class="terrain">${r.Terrain || '-'}</div></div>
                        <div class="mobile-full"><div class="notes">${r.Notes || '-'}</div></div>
                        <div class="actions" style="justify-content:space-between;">
                            <button class="secondary" style="flex:1;" onclick="editRun(${r.idx})">✏️ Edit</button>
                            ${isC ? `<button class="secondary" style="flex:1; background:#6c757d;" onclick="markIncomplete(${r.idx})">↩️ Undo</button>` : `<button class="secondary" style="flex:1;" onclick="markComplete(${r.idx})">✅ Done</button>`}
                        </div>
                    </div>`;
                }).join('')}</div>`;
                c.appendChild(div);
            });
            updateStats();
        }

        function dragStart(e) { draggedIndex = parseInt(e.target.closest('.run-item').dataset.index); e.target.closest('.run-item').classList.add('dragging'); }
        function dragOver(e) { e.preventDefault(); e.target.closest('.run-item')?.classList.add('drag-over'); }
        function drop(e) { 
            e.preventDefault(); 
            const dropTarget = e.target.closest('.run-item');
            if(dropTarget && draggedIndex !== null) {
                const dropIdx = parseInt(dropTarget.dataset.index);
                [trainingData[draggedIndex], trainingData[dropIdx]] = [trainingData[dropIdx], trainingData[draggedIndex]];
                saveToLocalStorage();
                renderWeeks();
            }
        }
        function dragEnd(e) { document.querySelectorAll('.run-item').forEach(i => i.classList.remove('dragging', 'drag-over')); }

        function editRun(i) { 
            currentEditIndex = i; 
            const r = trainingData[i]; 
            document.getElementById('editDay').value = r.Day;
            document.getElementById('editDate').value = r.Date;
            document.getElementById('editType').value = r.Type;
            document.getElementById('editDistance').value = r.Distance_km;
            document.getElementById('editPace').value = r.Pace;
            document.getElementById('editTerrain').value = r.Terrain;
            document.getElementById('editNotes').value = r.Notes;
            document.getElementById('editModal').classList.add('active');
        }

        function closeModal() { document.getElementById('editModal').classList.remove('active'); currentEditIndex = null; }

        document.getElementById('editForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const r = trainingData[currentEditIndex];
            r.Day = document.getElementById('editDay').value;
            r.Date = document.getElementById('editDate').value;
            r.Type = document.getElementById('editType').value;
            r.Distance_km = parseFloat(document.getElementById('editDistance').value);
            r.Pace = document.getElementById('editPace').value;
            r.Terrain = document.getElementById('editTerrain').value;
            r.Notes = document.getElementById('editNotes').value;
            saveToLocalStorage();
            renderWeeks();
            closeModal();
        });

        function resetFilters() { 
            document.getElementById('phaseFilter').value = 'all';
            document.getElementById('typeFilter').value = 'all';
            document.getElementById('searchBox').value = '';
            renderWeeks();
        }

        function exportToCSV() { 
            const headers = Object.keys(trainingData[0]).filter(k => k !== 'idx');
            const csv = [headers.join(','), ...trainingData.map(r => headers.map(h => {
                const v = r[h];
                return typeof v === 'string' ? (v.includes(',') ? `"${v}"` : v) : v;
            }).join(','))].join('\n');
            const blob = new Blob([csv], {type: 'text/csv'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'training_plan.csv';
            a.click();
        }

        document.getElementById('phaseFilter').addEventListener('change', renderWeeks);
        document.getElementById('typeFilter').addEventListener('change', renderWeeks);
        document.getElementById('searchBox').addEventListener('input', renderWeeks);
        document.getElementById('editModal').addEventListener('click', e => { if(e.target === document.getElementById('editModal')) closeModal(); });

        window.onload = () => {
            populateFilters();
            renderWeeks();
        };
    </script>
