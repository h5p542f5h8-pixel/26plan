<html lang="en">

            padding: 0;

        }

        body {

            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 10px;
            min-height: 100vh;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 2em;
            margin-bottom: 5px;
        }

        .view-toggle {
            padding: 10px 20px;
            background: #343a40;
            color: white;
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .view-toggle button {
            padding: 8px 20px;
            border: 2px solid white;
            background: transparent;
            color: white;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .view-toggle button.active {
            background: white;
            color: #343a40;
        }

        .controls {
            padding: 15px 20px;
            background: #f8f9fa;
            border-bottom: 2px solid #e9ecef;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-group label {
            font-weight: 600;
            color: #495057;
            font-size: 0.9em;
        }

        select, input[type="text"], input[type="number"], input[type="date"], button {
            padding: 8px 12px;
            border: 1px solid #ced4da;
            border-radius: 5px;
            font-size: 14px;
        }

        button {
            background: #667eea;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        button:hover {
            background: #764ba2;
            transform: translateY(-2px);
        }

        button.secondary {
            background: #28a745;
        }
        button.secondary:hover {
            background: #218838;
        }
        button.complete-btn {
            background: #28a745;
            font-size: 0.85em;
        }
        button.uncomplete-btn {
            background: #6c757d;
            font-size: 0.85em;
        }

        .content {
            padding: 20px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-card.completed {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
        }

        .stat-card h3 {
            font-size: 1.8em;
            margin-bottom: 5px;
        }

        .week-container {
            margin-bottom: 25px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            overflow: hidden;
        }

        .week-header {
            background: #343a40;
            color: white;
            padding: 12px 15px;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .phase-badge {
            background: rgba(255,255,255,0.2);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.85em;
        }

        .run-item.mobile-view {
            padding: 15px;
            border-bottom: 1px solid #e9ecef;
            display: flex;
            flex-direction: column;
            gap: 10px;
            cursor: move;
            transition: all 0.3s;
        }

        .run-item.completed {
            opacity: 0.6;
            background: #e8f5e9;
        }

        .run-item.race {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
        }

        .mobile-view .mobile-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .mobile-view .mobile-main {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .mobile-view .mobile-full {
            grid-column: 1 / -1;
        }

        .day-badge {
            background: #667eea;
            color: white;
            padding: 8px 12px;
            border-radius: 5px;
            text-align: center;
            font-weight: 600;
            font-size: 0.85em;
            cursor: pointer;
        }

        .run-type {
            font-weight: 600;
            color: #495057;
        }

        .distance {
            color: #667eea;
            font-weight: 600;
            cursor: pointer;
        }

        .run-time {
            color: #28a745;
            font-weight: 600;
        }

        .run-time-label {
            font-size: 0.75em;
            color: #6c757d;
            display: block;
        }

        .notes, .terrain, .pace {
            font-size: 0.85em;
            color: #495057;
        }

        .completion-badge {
            background: #28a745;
            color: white;
            padding: 3px 10px;
            border-radius: 15px;
            font-size: 0.75em;
            margin-left: 10px;
        }

        .drag-handle {
            cursor: move;
            color: #6c757d;
            font-size: 1.2em;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 10px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ced4da;
            border-radius: 5px;
        }

        .control-btn {
            background: #ffc107 !important;
            color: #333 !important;
        }
        .content.is-locked {
            opacity: 0.35;
            pointer-events: none;
            filter: grayscale(0.6);
        }
        @media (max-width: 768px) {
            .header h1 { font-size: 1.5em; }
        }
    </style>
</head>

<div class="container">
    <div class="header">
        <h1>🏔️ 2026 Ultra Plan (CSV Updated)</h1>
        <p>Oxford Ultra · Kranjska · Bournemouth 50K · Oxford Half</p>
    </div>

    <div class="view-toggle">
        <button id="laptopBtn" onclick="switchView('laptop')">💻 Laptop View</button>
        <button id="mobileBtn" class="active" onclick="switchView('mobile')">📱 Mobile View</button>
        <button id="showCompletedBtn" onclick="toggleShowCompleted()">👁️ Show Completed</button>
    </div>

    <div class="controls">
        <div class="control-group">
            <label>Phase:</label>
            <select id="phaseFilter"><option value="all">All</option></select>
        </div>
        <div class="control-group">
            <label>Type:</label>
            <select id="typeFilter"><option value="all">All</option></select>
        </div>
        <div class="control-group">
            <label>Search:</label>
            <input type="text" id="searchBox" placeholder="Search...">
        </div>
        <button onclick="resetFilters()">Reset</button>
        <button class="secondary" onclick="exportToCSV()">📥 CSV</button>
        <button class="secondary" onclick="saveToLocalStorage()">💾 Save</button>
        <button id="lockToggleBtn" class="control-btn" onclick="toggleLock()">🔓 Unlocked</button>
    </div>

    <div class="content">
        <div class="stats" id="statsContainer"></div>
        <div id="weeksContainer"></div>
        <div class="export-section" style="margin-top:25px; padding:20px; background:#f8f9fa; border-radius:10px; text-align:center;">
            <p>✅ 86 sessions · Default: Mobile + Completed hidden</p>
        </div>
    </div>
</div>

<div id="editModal" class="modal">
    <div class="modal-content">
        <h2>Edit Run</h2>
        <form id="editForm">
            <div class="form-group"><label>Day:</label><select id="editDay"><option>Mon</option><option>Tue</option><option>Wed</option><option>Thu</option><option>Fri</option><option>Sat</option><option>Sun</option></select></div>
            <div class="form-group"><label>Date:</label><input type="date" id="editDate"></div>
            <div class="form-group"><label>Run Type:</label><input type="text" id="editType"></div>
            <div class="form-group"><label>Distance (km):</label><input type="number" id="editDistance" step="any"></div>
            <div class="form-group"><label>Distance (miles):</label><input type="number" id="editDistanceMiles" step="any"></div>
            <div class="form-group"><label>Pace:</label><input type="text" id="editPace"></div>
            <div class="form-group"><label>Terrain:</label><input type="text" id="editTerrain"></div>
            <div class="form-group"><label>Notes:</label><textarea id="editNotes"></textarea></div>
            <div class="modal-actions" style="display:flex; gap:10px;">
                <button type="submit" class="secondary">Save</button>
                <button type="button" onclick="closeModal()">Cancel</button>
            </div>
        </form>
    </div>
</div>

        {Week:18,Run:72,Date:"2026-09-19",Day:"Sat",Phase:"Kranjska taper/race week","Run.1":"Shakeout",Distance_km:6,Pace:"Very easy",Terrain:"Flat trail",Notes:"Shakeout"},
        {Week:21,Run:73,Date:"2026-09-20",Day:"Sun",Phase:"Kranjska Race","Run.1":"Race",Distance_km:25,Pace:"Race Pace",Terrain:"Mountain trail",Notes:"Kranjska Gora 25K"},
        {Week:19,Run:74,Date:"2026-09-21",Day:"Mon",Phase:"Bournemouth build/taper","Run.1":"Zone 2",Distance_km:10,Pace:"6:15-6:50/km",Terrain:"Zone 2 HR",Notes:"Recovery"},
        {Week:19,Run:75,Date:"2026-09-22",Day:"Tue",Phase:"Bournemouth build/taper","Run.1":"Hill quality",Distance_km:7,Pace:"4:20-5:15/km reps",Terrain:"Hill route",Notes:"Hill reps"},
        {Week:19,Run:76,Date:"2026-09-24",Day:"Thu",Phase:"Bournemouth build/taper","Run.1":"Progression Steady",Distance_km:16,Pace:"Finish last 5km at 5:12/km",Terrain:"Rolling",Notes:"Blend stamina"},
        {Week:19,Run:77,Date:"2026-09-26",Day:"Sat",Phase:"Bournemouth build/taper","Run.1":"Long",Distance_km:32,Pace:"6:15-7:15/km",Terrain:"Trail/hills",Notes:"Fuel practice"},
        {Week:20,Run:78,Date:"2026-09-28",Day:"Mon",Phase:"Bournemouth build/taper","Run.1":"Zone 2",Distance_km:10,Pace:"6:15-6:50/km",Terrain:"Zone 2 HR",Notes:"Recovery"},
        {Week:20,Run:79,Date:"2026-09-29",Day:"Tue",Phase:"Bournemouth build/taper","Run.1":"Hill quality",Distance_km:7,Pace:"4:20-5:15/km reps",Terrain:"Hill route",Notes:"Hill reps"},
        {Week:20,Run:80,Date:"2026-10-01",Day:"Thu",Phase:"Bournemouth build/taper","Run.1":"Progression Steady",Distance_km:16,Pace:"Finish last 5km at 5:12/km",Terrain:"Rolling",Notes:"Blend stamina"},
        {Week:20,Run:81,Date:"2026-10-03",Day:"Sat",Phase:"Bournemouth Race","Run.1":"Race",Distance_km:50,Pace:"Aim 6h moving",Terrain:"Coastal ultra",Notes:"Bournemouth 50K"},
        {Week:21,Run:82,Date:"2026-10-05",Day:"Mon",Phase:"Half taper","Run.1":"Zone 2",Distance_km:8,Pace:"6:15-6:50/km",Terrain:"Zone 2 HR",Notes:"Recovery"},
        {Week:21,Run:83,Date:"2026-10-06",Day:"Tue",Phase:"Half taper","Run.1":"Speed Quality",Distance_km:7,Pace:"4x2km @5:12/km",Terrain:"Track",Notes:"Neural sharpening"},
        {Week:21,Run:84,Date:"2026-10-08",Day:"Thu",Phase:"Half taper","Run.1":"Interval Sharpening",Distance_km:7,Pace:"3x3km @5:12/km",Terrain:"Rolling",Notes:"HM intensity"},
        {Week:21,Run:85,Date:"2026-10-10",Day:"Sat",Phase:"Half taper","Run.1":"Shakeout",Distance_km:5,Pace:"Very easy",Terrain:"Flat",Notes:"Pre-race"},
        {Week:21,Run:86,Date:"2026-10-11",Day:"Sun",Phase:"Half taper","Run.1":"Race",Distance_km:21.1,Pace:"5:12/km",Terrain:"Road",Notes:"Oxford Half (1:50)"}
    ];

    let trainingData = freshRunsData.map((run, idx) => ({
        ...run,
        completed: false,
        Date: run.Date + " 00:00:00"
    }));

    // Load saved completion status
    const saved = localStorage.getItem('trainingPlanDEV_v2');
    if (saved) {
        try {
            const parsed = JSON.parse(saved);
            if (parsed.length === trainingData.length) {
                parsed.forEach((s, i) => { if (s && typeof s.completed === 'boolean') trainingData[i].completed = s.completed; });
            }
        } catch(e) {}
    }

    // Global state
    let currentEditIndex = null;
    let draggedIndex = null;
    let currentView = 'mobile';
    let showCompleted = false;   // DEFAULT: HIDE COMPLETED RUNS

    // Helper functions
    function saveToLocalStorage() {
        localStorage.setItem('trainingPlanDEV_v2', JSON.stringify(trainingData.map(({completed}) => ({completed}))));
    }

    function formatDate(dateStr) {
        const d = new Date(dateStr);
        return d.toLocaleDateString('en-GB', {day:'2-digit', month:'short'});
    }

    function formatDateFull(dateStr) {
        const d = new Date(dateStr);
        return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
    }

    function calculateRunTime(paceStr, distKm) {
        if (!paceStr || !distKm) return { min: null, max: null };
        try {
            if (paceStr.includes('-') && paceStr.includes('/km')) {
                const parts = paceStr.replace('/km','').trim().split('-');
                const toMin = (p) => { let [m,s]=p.trim().split(':'); return parseFloat(m)+parseFloat(s)/60; };
                const minPace = toMin(parts[0]), maxPace = toMin(parts[1]);
                const d = parseFloat(distKm);
                return { min: minPace * d, max: maxPace * d };
            }
        } catch(e) {}
        return { min: null, max: null };
    }

    function formatTime(min) {
        if (min === null || isNaN(min)) return '-';
        const h = Math.floor(min / 60);
        const m = Math.floor(min % 60);
        return h > 0 ? `${h}h ${m}m` : `${m}m`;
    }

    function updateStats() {
        const total = trainingData.length;
        const completed = trainingData.filter(r => r.completed).length;
        const remaining = total - completed;
        const totalDist = trainingData.reduce((s,r) => s + (parseFloat(r.Distance_km)||0), 0);
        const completedDist = trainingData.reduce((s,r) => r.completed ? s + (parseFloat(r.Distance_km)||0) : s, 0);
        const races = trainingData.filter(r => r['Run.1'] === 'Race').length;
        document.getElementById('statsContainer').innerHTML = `
            <div class="stat-card"><h3>${total}</h3><p>Total Runs</p></div>
            <div class="stat-card completed"><h3>${completed}</h3><p>Completed ✅</p></div>
            <div class="stat-card"><h3>${remaining}</h3><p>Remaining</p></div>
            <div class="stat-card"><h3>${totalDist.toFixed(1)} km</h3><p>Total Distance</p></div>
            <div class="stat-card completed"><h3>${completedDist.toFixed(1)} km</h3><p>Completed Distance</p></div>
            <div class="stat-card"><h3>${races}</h3><p>Race Days</p></div>
        `;
    }

    function populateFilters() {
        const phases = new Set(trainingData.map(r => r.Phase));
        const types = new Set(trainingData.map(r => r['Run.1']));
        const phaseSel = document.getElementById('phaseFilter');
        const typeSel = document.getElementById('typeFilter');
        phases.forEach(p => { let opt = document.createElement('option'); opt.value = p; opt.textContent = p; phaseSel.appendChild(opt); });
        types.forEach(t => { let opt = document.createElement('option'); opt.value = t; opt.textContent = t; typeSel.appendChild(opt); });
    }

    function renderWeeks() {
        const phaseVal = document.getElementById('phaseFilter').value;
        const typeVal = document.getElementById('typeFilter').value;
        const search = document.getElementById('searchBox').value.toLowerCase();
        let filtered = trainingData.filter(r => showCompleted ? true : !r.completed);
        if (phaseVal !== 'all') filtered = filtered.filter(r => r.Phase === phaseVal);
        if (typeVal !== 'all') filtered = filtered.filter(r => r['Run.1'] === typeVal);
        if (search) filtered = filtered.filter(r => JSON.stringify(r).toLowerCase().includes(search));

        const groups = {};
        filtered.forEach(run => { run.originalIndex = trainingData.indexOf(run); const w = run.Week; if (!groups[w]) groups[w] = []; groups[w].push(run); });
        const container = document.getElementById('weeksContainer');
        container.innerHTML = '';
        Object.keys(groups).sort((a,b)=>a-b).forEach(week => {
            const runs = groups[week];
            const phase = runs[0].Phase;
            const weekTotal = runs.reduce((s,r) => s + (parseFloat(r.Distance_km)||0), 0);
            const weekCompleted = runs.filter(r => r.completed).length;
            const runsHtml = runs.map(run => {
                const miles = (parseFloat(run.Distance_km)*0.621371).toFixed(1);
                const isRace = run['Run.1'] === 'Race';
                const isCompleted = run.completed;
                const rt = calculateRunTime(run.Pace, run.Distance_km);
                const timeDisplay = rt.min ? `${formatTime(rt.min)} - ${formatTime(rt.max)}` : '-';
                const idx = run.originalIndex;
                return `<div class="run-item mobile-view ${isRace ? 'race' : ''} ${isCompleted ? 'completed' : ''}" draggable="true" data-index="${idx}" ondragstart="handleDragStart(event)" ondragover="handleDragOver(event)" ondrop="handleDrop(event)" ondragend="handleDragEnd(event)">
                    <div class="mobile-header">
                        <div style="display:flex; gap:10px; align-items:center;">
                            <span class="drag-handle">⋮⋮</span>
                            <div class="day-badge" onclick="quickEditDay(${idx})">${run.Day}</div>
                            <div class="date-display" style="cursor:pointer; font-size:0.85rem;" onclick="quickEditDate(${idx})">${formatDate(run.Date)}</div>
                            ${isCompleted ? '<span style="color:#28a745;">✅</span>' : ''}
                        </div>
                        <div>
                            ${isCompleted ? `<button class="uncomplete-btn" onclick="markIncomplete(${idx})">↩️</button>` : `<button class="complete-btn" onclick="markComplete(${idx})">✅</button>`}
                            <button onclick="editRun(${idx})" style="padding:5px 10px;">✏️</button>
                        </div>
                    </div>
                    <div class="mobile-main">
                        <div><div class="run-type">${run['Run.1']}</div><div class="distance" onclick="quickEditDistance(${idx})">${run.Distance_km} km<br><small>${miles} mi</small></div></div>
                        <div><span class="run-time-label">Est. Time</span><div class="run-time">${timeDisplay}</div></div>
                        <div class="mobile-full"><div class="pace">${run.Pace || '-'}</div><div class="notes">${run.Notes || '-'}</div></div>
                        <div class="mobile-full"><div class="terrain">${run.Terrain || '-'}</div></div>
                    </div>
                </div>`;
            }).join('');
            const weekDiv = document.createElement('div');
            weekDiv.className = 'week-container';
            weekDiv.innerHTML = `<div class="week-header"><span>Week ${week} - ${weekTotal.toFixed(1)} km (${(weekTotal*0.621371).toFixed(1)} mi)${weekCompleted > 0 ? ` <span class="completion-badge">${weekCompleted}/${runs.length} ✅</span>` : ''}</span><span class="phase-badge">${phase}</span></div><div class="runs-list">${runsHtml}</div>`;
            container.appendChild(weekDiv);
        });
        updateStats();
    }

    // Mark complete/incomplete
    window.markComplete = (idx) => { trainingData[idx].completed = true; saveToLocalStorage(); renderWeeks(); };
    window.markIncomplete = (idx) => { trainingData[idx].completed = false; saveToLocalStorage(); renderWeeks(); };

    // View switching
    window.switchView = (view) => {
        currentView = view;
        document.getElementById('laptopBtn').classList.toggle('active', view === 'laptop');
        document.getElementById('mobileBtn').classList.toggle('active', view === 'mobile');
        renderWeeks();
    };

    // Toggle show completed (fixed logic)
    window.toggleShowCompleted = () => {
        showCompleted = !showCompleted;
        const btn = document.getElementById('showCompletedBtn');
        btn.textContent = showCompleted ? '🙈 Hide Completed' : '👁️ Show Completed';
        renderWeeks();
    };

    // Drag & drop
    window.handleDragStart = (e) => {
        draggedIndex = parseInt(e.target.closest('.run-item').dataset.index);
        e.target.closest('.run-item').classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
    };
    window.handleDragOver = (e) => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; };
    window.handleDrop = (e) => {
        e.preventDefault();
        const target = e.target.closest('.run-item');
        if (target && draggedIndex !== undefined) {
            const dropIdx = parseInt(target.dataset.index);
            const temp = trainingData[draggedIndex];
            trainingData[draggedIndex] = trainingData[dropIdx];
            trainingData[dropIdx] = temp;
            const w1 = trainingData[draggedIndex].Week, w2 = trainingData[dropIdx].Week;
            trainingData[draggedIndex].Week = w2;
            trainingData[dropIdx].Week = w1;
            saveToLocalStorage();
            renderWeeks();
        }
        draggedIndex = undefined;
    };
    window.handleDragEnd = (e) => { e.target.classList.remove('dragging'); };

    // Edit functions
    window.editRun = (idx) => {
        currentEditIndex = idx;
        const r = trainingData[idx];
        document.getElementById('editDay').value = r.Day;
        document.getElementById('editDate').value = new Date(r.Date).toISOString().split('T')[0];
        document.getElementById('editType').value = r['Run.1'];
        document.getElementById('editDistance').value = parseFloat(r.Distance_km);
        document.getElementById('editDistanceMiles').value = (parseFloat(r.Distance_km)*0.621371).toFixed(2);
        document.getElementById('editPace').value = r.Pace;
        document.getElementById('editTerrain').value = r.Terrain;
        document.getElementById('editNotes').value = r.Notes;
        document.getElementById('editModal').classList.add('active');
    };
    window.closeModal = () => { document.getElementById('editModal').classList.remove('active'); currentEditIndex = null; };
    window.quickEditDay = (idx) => {
        const days = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
        const run = trainingData[idx];
        const cur = days.indexOf(run.Day);
        const newDay = days[(cur+1)%7];
        run.Day = newDay;
        const date = new Date(run.Date);
        const diff = (days.indexOf(newDay) - cur + 7) % 7;
        date.setDate(date.getDate() + diff);
        run.Date = date.toISOString();
        saveToLocalStorage(); renderWeeks();
    };
    window.quickEditDate = (idx) => {
        const run = trainingData[idx];
        const newDate = prompt('Enter new date (DD/MM/YYYY):', formatDateFull(run.Date));
        if (newDate) {
            const parts = newDate.split('/');
            if (parts.length === 3) {
                const d = new Date(parts[2], parts[1]-1, parts[0]);
                run.Date = d.toISOString();
                const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
                run.Day = days[d.getDay()];
                saveToLocalStorage(); renderWeeks();
            }
        }
    };
    window.quickEditDistance = (idx) => {
        const run = trainingData[idx];
        const currKm = parseFloat(run.Distance_km);
        let resp = prompt(`Distance (km or mi, e.g., "15 km" or "10 mi"):\nCurrent: ${currKm.toFixed(1)} km`, `${currKm.toFixed(1)} km`);
        if (resp) {
            let val;
            const t = resp.trim().toLowerCase();
            if (t.includes('mi') || t.includes('miles')) { let m = parseFloat(t.match(/[\d.]+/)[0]); val = m / 0.621371; }
            else { val = parseFloat(t.match(/[\d.]+/)[0]); }
            if (!isNaN(val)) { run.Distance_km = val.toFixed(1); saveToLocalStorage(); renderWeeks(); updateStats(); }
        }
    };
    window.resetFilters = () => {
        document.getElementById('phaseFilter').value = 'all';
        document.getElementById('typeFilter').value = 'all';
        document.getElementById('searchBox').value = '';
        renderWeeks();
    };
    window.exportToCSV = () => {
        const headers = Object.keys(trainingData[0]);
        const rows = trainingData.map(r => headers.map(h => h === 'Date' ? formatDateFull(r[h]) : (typeof r[h] === 'string' && r[h].includes(',') ? `"${r[h]}"` : r[h])).join(','));
        const csv = [headers.join(','), ...rows].join('\n');
        const blob = new Blob([csv], {type: 'text/csv'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'training_plan_2026.csv';
        a.click();
    };

    // Edit form submission
    document.getElementById('editForm').addEventListener('submit', (e) => {
        e.preventDefault();
        if (currentEditIndex === null) return;
        const run = trainingData[currentEditIndex];
        run.Day = document.getElementById('editDay').value;
        const dateVal = document.getElementById('editDate').value;
        run.Date = new Date(dateVal).toISOString();
        run['Run.1'] = document.getElementById('editType').value;
        run.Distance_km = parseFloat(document.getElementById('editDistance').value).toFixed(1);
        run.Pace = document.getElementById('editPace').value;
        run.Terrain = document.getElementById('editTerrain').value;
        run.Notes = document.getElementById('editNotes').value;
        saveToLocalStorage();
        closeModal();
        renderWeeks();
        updateStats();
    });

    // Sync miles/km
    let _kmLock = false, _miLock = false;
    document.getElementById('editDistance').addEventListener('input', function() { if (!_kmLock) { _miLock = true; const km = parseFloat(this.value); if (!isNaN(km)) document.getElementById('editDistanceMiles').value = (km * 0.621371).toFixed(2); _miLock = false; } });
    document.getElementById('editDistanceMiles').addEventListener('input', function() { if (!_miLock) { _kmLock = true; const mi = parseFloat(this.value); if (!isNaN(mi)) document.getElementById('editDistance').value = (mi / 0.621371).toFixed(2); _kmLock = false; } });
    document.getElementById('editDate').addEventListener('change', function(e) { const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat']; document.getElementById('editDay').value = days[new Date(e.target.value).getDay()]; });

    // Lock system (simple, with fallback for non-HTTPS)
    let isLocked = false;
    window.toggleLock = () => {
        if (!isLocked) {
            isLocked = true;
            document.querySelector('.content').classList.add('is-locked');
            document.getElementById('lockToggleBtn').textContent = '🔒 Locked';
        } else {
            const pwd = prompt("Enter PIN to unlock (default: 1234):");
            if (pwd === "1234") {
                isLocked = false;
                document.querySelector('.content').classList.remove('is-locked');
                document.getElementById('lockToggleBtn').textContent = '🔓 Unlocked';
            } else if (pwd !== null) alert("Incorrect PIN");
        }
    };

    // Initial load
    populateFilters();
    switchView('mobile');          // mobile default
    // Ensure showCompleted = false (hide completed) and button text correct
    showCompleted = false;
    document.getElementById('showCompletedBtn').textContent = '👁️ Show Completed';
    renderWeeks();
</script>
</body>
</html>
