<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 10px;
            min-height: 100vh;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 2em;
            margin-bottom: 5px;
        }

        .view-toggle {
            padding: 10px 20px;
            background: #343a40;
            color: white;
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .view-toggle button {
            padding: 8px 20px;
            border: 2px solid white;
            background: transparent;
            color: white;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .view-toggle button.active {
            background: white;
            color: #343a40;
        }

        .controls {
            padding: 15px 20px;
            background: #f8f9fa;
            border-bottom: 2px solid #e9ecef;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-group label {
            font-weight: 600;
            color: #495057;
            font-size: 0.9em;
        }

        select, input[type="text"], input[type="number"], input[type="date"], input[type="checkbox"], button {
            padding: 8px 12px;
            border: 1px solid #ced4da;
            border-radius: 5px;
            font-size: 14px;
        }

        input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        select:focus, input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        button {
            background: #667eea;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        button:hover {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        button.secondary {
            background: #28a745;
        }

        button.secondary:hover {
            background: #218838;
        }

        button.complete-btn {
            background: #28a745;
            font-size: 0.85em;
        }

        button.complete-btn:hover {
            background: #218838;
        }

        button.uncomplete-btn {
            background: #6c757d;
            font-size: 0.85em;
        }

        button.uncomplete-btn:hover {
            background: #5a6268;
        }

        .content {
            padding: 20px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-card.completed {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
        }

        .stat-card h3 {
            font-size: 1.8em;
            margin-bottom: 5px;
        }

        .stat-card p {
            opacity: 0.9;
            font-size: 0.85em;
        }

        .week-container {
            margin-bottom: 25px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            overflow: hidden;
        }

        .week-header {
            background: #343a40;
            color: white;
            padding: 12px 15px;
            font-weight: 600;
            font-size: 1em;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .phase-badge {
            background: rgba(255,255,255,0.2);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.85em;
        }

        .runs-list {
            background: white;
        }

        .run-item.desktop-view {
            padding: 15px;
            border-bottom: 1px solid #e9ecef;
            display: grid;
            grid-template-columns: 40px 80px 100px 100px 80px 120px 1fr 250px 140px;
            gap: 15px;
            align-items: center;
            cursor: move;
            transition: all 0.3s;
        }

        .run-item.completed {
            opacity: 0.6;
            background: #e8f5e9;
        }

        .run-item.completed.desktop-view {
            text-decoration: line-through;
        }

        .run-item.mobile-view {
            padding: 15px;
            border-bottom: 1px solid #e9ecef;
            display: flex;
            flex-direction: column;
            gap: 10px;
            cursor: move;
            transition: all 0.3s;
        }

        .mobile-view .mobile-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .mobile-view .mobile-main {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .mobile-view .mobile-full {
            grid-column: 1 / -1;
        }

        .run-item:hover {
            background: #f8f9fa;
        }

        .run-item.completed:hover {
            background: #c8e6c9;
        }

        .run-item.dragging {
            opacity: 0.5;
            background: #e9ecef;
        }

        .run-item.drag-over {
            border-top: 3px solid #667eea;
        }

        .run-item:last-child {
            border-bottom: none;
        }

        .run-item.race {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
        }

        .run-item.race:hover {
            background: #ffeaa7;
        }

        .run-item.race.completed {
            background: #fffacd;
        }

        .day-badge {
            background: #667eea;
            color: white;
            padding: 8px 12px;
            border-radius: 5px;
            text-align: center;
            font-weight: 600;
            font-size: 0.85em;
            cursor: pointer;
            white-space: nowrap;
        }

        .day-badge:hover {
            background: #764ba2;
        }

        .run-type {
            font-weight: 600;
            color: #495057;
            font-size: 0.95em;
        }

        .distance {
            color: #667eea;
            font-weight: 600;
            font-size: 0.95em;
            cursor: pointer;
        }

        .distance:hover {
            text-decoration: underline;
        }

        .run-time {
            color: #28a745;
            font-weight: 600;
            font-size: 0.9em;
        }

        .run-time-label {
            font-size: 0.75em;
            color: #6c757d;
            display: block;
        }

        .pace {
            color: #6c757d;
            font-size: 0.85em;
            margin-bottom: 5px;
        }

        .notes {
            color: #495057;
            font-size: 0.85em;
            line-height: 1.4;
        }

        .terrain {
            color: #6c757d;
            font-size: 0.8em;
            line-height: 1.3;
        }

        .date-display {
            color: #495057;
            font-size: 0.85em;
            cursor: pointer;
        }

        .date-display:hover {
            color: #667eea;
            text-decoration: underline;
        }

        .actions {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }

        .actions button {
            padding: 5px 10px;
            font-size: 0.85em;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 10px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-content h2 {
            margin-bottom: 20px;
            color: #343a40;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #495057;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ced4da;
            border-radius: 5px;
            font-size: 14px;
        }

        .form-group textarea {
            min-height: 80px;
            resize: vertical;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-actions button {
            flex: 1;
        }

        .export-section {
            margin-top: 25px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            text-align: center;
        }

        .drag-handle {
            cursor: move;
            color: #6c757d;
            font-size: 1.2em;
        }

        .details-column {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .hidden {
            display: none !important;
        }

        .completion-badge {
            background: #28a745;
            color: white;
            padding: 3px 10px;
            border-radius: 15px;
            font-size: 0.75em;
            font-weight: bold;
            margin-left: 10px;
        }

        .control-btn {
            background: #ffc107 !important;
            color: #333 !important;
            border: 1px solid #e0a800;
        }

        .control-btn:hover {
            background: #e0a800 !important;
        }

        .content.is-locked {
            opacity: 0.35;
            pointer-events: none;
            filter: grayscale(0.6);
        }

        .controls.is-locked {
            pointer-events: auto;
            opacity: 1;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.5em;
            }

            .controls {
                padding: 10px;
            }

            .stat-card h3 {
                font-size: 1.5em;
            }
        }
    </style>
</head>

            <h1>🏔️ 2026 Ultra Plan (V1.6)</h1>

        <div class="view-toggle">

            <button id="showCompletedBtn" onclick="toggleShowCompleted()">🙈 Hide Completed</button>
        </div>

        <div class="controls">
            <div class="control-group">
                <label>Phase:</label>
                <select id="phaseFilter">
                    <option value="all">All</option>

            <div class="control-group">
                <label>Type:</label>
                <select id="typeFilter">
                    <option value="all">All</option>
                </select>
            </div>

            <div class="control-group">
                <label>Search:</label>
                <input type="text" id="searchBox" placeholder="Search...">
            </div>

            <button onclick="resetFilters()">Reset</button>
            <button class="secondary" onclick="exportToCSV()">📥 CSV</button>
            <button class="secondary" onclick="saveToLocalStorage()">💾 Save</button>
            <button id="lockToggleBtn" class="control-btn" onclick="toggleLock()">🔓 Unlocked</button>
        </div>

        <div class="content">
            <div class="stats" id="statsContainer"></div>
            <div id="weeksContainer"></div>

            <div class="export-section">

        </div>
    </div>

                        <option value="Tue">Tuesday</option>
                        <option value="Wed">Wednesday</option>
                        <option value="Thu">Thursday</option>
                        <option value="Fri">Friday</option>
                        <option value="Sat">Saturday</option>
                        <option value="Sun">Sunday</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Date (DD/MM/YYYY):</label>
                    <input type="text" id="editDate" placeholder="DD/MM/YYYY">
                </div>

                <div class="form-group">
                    <label>Run Type:</label>
                    <input type="text" id="editType">
                </div>

                <div class="form-group">
                    <label>Distance (km):</label>
                    <input type="number" id="editDistance" step="any" min="0">
                </div>

                <div class="form-group">
                    <label>Distance (miles):</label>
                    <input type="number" id="editDistanceMiles" step="any" min="0">
                </div>

                <div class="form-group">
                    <label>Pace:</label>
                    <input type="text" id="editPace" placeholder="e.g., 6:15-6:50/km">
                </div>

                <div class="form-group">
                    <label>Terrain:</label>
                    <input type="text" id="editTerrain">
                </div>

                <div class="form-group">
                    <label>Notes:</label>
                    <textarea id="editNotes"></textarea>
                </div>

                <div class="modal-actions">
                    <button type="submit" class="secondary">Save Changes</button>
                    <button type="button" onclick="closeModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

        function calculateRunTime(paceStr, distanceKm) {
            if (!paceStr || paceStr === '-' || !distanceKm) return { min: null, max: null };
            try {
                if (paceStr.includes('-') && paceStr.includes('/km')) {
                    const paceRange = paceStr.replace('/km', '').trim();
                    const parts = paceRange.split('-');
                    const paceToMinutes = (pace) => { const [mins, secs] = pace.trim().split(':'); return parseFloat(mins) + parseFloat(secs) / 60; };
                    const minPace = paceToMinutes(parts[0]), maxPace = paceToMinutes(parts[1]);
                    const d = parseFloat(distanceKm);
                    return { min: minPace * d, max: maxPace * d };
                }
            } catch(e) {}
            return { min: null, max: null };
        }

        function formatTime(minutes) {
            if (!minutes && minutes !== 0) return '-';
            const hours = Math.floor(minutes / 60);
            const mins = Math.floor(minutes % 60);
            return hours > 0 ? `${hours}h ${mins}m` : `${mins}m`;
        }

        function saveToLocalStorage() { 
            localStorage.setItem('trainingPlanDEV_v2', JSON.stringify(trainingData.map(({completed}) => ({completed}))));
        }

        function updateStats() {
            const totalRuns = trainingData.length;
            const completedRuns = trainingData.filter(run => run.completed).length;
            const remainingRuns = totalRuns - completedRuns;
            const totalDistance = trainingData.reduce((sum, run) => sum + (parseFloat(run.Distance_km) || 0), 0);
            const completedDistance = trainingData.reduce((sum, run) => run.completed ? sum + (parseFloat(run.Distance_km) || 0) : sum, 0);
            const races = trainingData.filter(run => run.Type === 'Race').length;
            document.getElementById('statsContainer').innerHTML = `
                <div class="stat-card"><h3>${totalRuns}</h3><p>Total Runs</p></div>
                <div class="stat-card completed"><h3>${completedRuns}</h3><p>Completed ✅</p></div>
                <div class="stat-card"><h3>${remainingRuns}</h3><p>Remaining</p></div>
                <div class="stat-card"><h3>${totalDistance.toFixed(1)} km</h3><p>Total Distance</p></div>
                <div class="stat-card completed"><h3>${completedDistance.toFixed(1)} km</h3><p>Completed Distance</p></div>
                <div class="stat-card"><h3>${races}</h3><p>Race Days</p></div>
            `;
        }

            phases.forEach(p => { const opt = document.createElement('option'); opt.value = p; opt.textContent = p; phaseFilter.appendChild(opt); });

        }

        function renderWeeks() {
            const phaseVal = document.getElementById('phaseFilter').value;
            const typeVal = document.getElementById('typeFilter').value;
            const searchTerm = document.getElementById('searchBox').value.toLowerCase();
            let filtered = trainingData.filter(r => showCompleted || !r.completed);
            if(phaseVal !== 'all') filtered = filtered.filter(r => r.Phase === phaseVal);
            if(typeVal !== 'all') filtered = filtered.filter(r => r.Type === typeVal);
            if(searchTerm) filtered = filtered.filter(r => JSON.stringify(r).toLowerCase().includes(searchTerm));
            
            const weekGroups = {};
            filtered.forEach((run, idx) => { 
                const w = run.Week; 
                if(!weekGroups[w]) weekGroups[w]=[]; 
                weekGroups[w].push({...run, originalIndex: trainingData.indexOf(run)});
            });
            
            const container = document.getElementById('weeksContainer');
            container.innerHTML = '';
            Object.keys(weekGroups).sort((a,b)=>a-b).forEach(week => {
                const runs = weekGroups[week];
                const weekDiv = document.createElement('div');
                weekDiv.className = 'week-container';
                const phase = runs[0].Phase;
                const weekTotal = runs.reduce((s,r)=>s+(parseFloat(r.Distance_km)||0),0);
                const weekCompleted = runs.filter(r=>r.completed).length;
                weekDiv.innerHTML = `<div class="week-header"><span>Week ${week} - ${weekTotal.toFixed(1)} km (${(weekTotal*0.621371).toFixed(1)} mi)${weekCompleted>0?` <span class="completion-badge">${weekCompleted}/${runs.length}</span>`:''}</span><span class="phase-badge">${phase}</span></div><div class="runs-list">${runs.map(run => {
                    const miles = (parseFloat(run.Distance_km)*0.621371).toFixed(1);
                    const isRace = run.Type === 'Race';
                    const isCompleted = run.completed;
                    const rt = calculateRunTime(run.Pace, run.Distance_km);
                    const timeDisplay = rt.min ? `${formatTime(rt.min)} - ${formatTime(rt.max)}` : '-';
                    if(currentView === 'mobile') {
                        return `<div class="run-item mobile-view ${isRace?'race':''} ${isCompleted?'completed':''}" draggable="true" data-index="${run.originalIndex}" ondragstart="handleDragStart(event)" ondragover="handleDragOver(event)" ondrop="handleDrop(event)" ondragend="handleDragEnd(event)">

                            <div style="display:flex; gap:5px;"><button class="secondary" onclick="editRun(${run.originalIndex})">Edit</button></div></div>`;
                    } else {
                        return `<div class="run-item desktop-view ${isRace?'race':''} ${isCompleted?'completed':''}" draggable="true" data-index="${run.originalIndex}" ondragstart="handleDragStart(event)" ondragover="handleDragOver(event)" ondrop="handleDrop(event)" ondragend="handleDragEnd(event)">

                    }

        function handleDragStart(e) { draggedElement = e.target; draggedIndex = parseInt(e.target.closest('.run-item').dataset.index); e.target.closest('.run-item').classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; }

        async function initLockSystem() {

            window.toggleLock = async function() {
                if(!isLocked) {
                    if(!storedHash){ const pin=prompt('Set a PIN to lock the plan:'); if(pin){ const hash=await sha256(pin); localStorage.setItem(STORAGE_KEY_HASH,hash); isLocked=true; localStorage.setItem(STORAGE_KEY_LOCKED,'true'); applyLockUI(); } }
                    else { isLocked=true; localStorage.setItem(STORAGE_KEY_LOCKED,'true'); applyLockUI(); }
                } else {
                    const pin=prompt('Enter PIN to unlock:');
                    if(pin && storedHash && await sha256(pin)===storedHash) { isLocked=false; localStorage.setItem(STORAGE_KEY_LOCKED,'false'); applyLockUI(); }
                    else if(pin) alert('Incorrect PIN');
                }
            };
            applyLockUI();
        }

        window.onload = () => {
            populateFilters();
            switchView('mobile');
            renderWeeks();
            initLockSystem();
        };
    </script>
</body>
</html>
