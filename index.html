<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Training Plan Manager [DEV v2]</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 10px;
            min-height: 100vh;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 2em;
            margin-bottom: 5px;
        }



        .view-toggle {
            padding: 10px 20px;
            background: #343a40;
            color: white;
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .view-toggle button {
            padding: 8px 20px;
            border: 2px solid white;
            background: transparent;
            color: white;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .view-toggle button.active {
            background: white;
            color: #343a40;
        }

        .controls {
            padding: 15px 20px;
            background: #f8f9fa;
            border-bottom: 2px solid #e9ecef;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-group label {
            font-weight: 600;
            color: #495057;
            font-size: 0.9em;
        }

        select, input[type="text"], input[type="number"], input[type="date"], input[type="checkbox"], button {
            padding: 8px 12px;
            border: 1px solid #ced4da;
            border-radius: 5px;
            font-size: 14px;
        }

        input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        select:focus, input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        button {
            background: #667eea;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        button:hover {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        button.secondary {
            background: #28a745;
        }

        button.secondary:hover {
            background: #218838;
        }

        button.complete-btn {
            background: #28a745;
            font-size: 0.85em;
        }

        button.complete-btn:hover {
            background: #218838;
        }

        button.uncomplete-btn {
            background: #6c757d;
            font-size: 0.85em;
        }

        button.uncomplete-btn:hover {
            background: #5a6268;
        }

        .content {
            padding: 20px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-card.completed {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
        }

        .stat-card h3 {
            font-size: 1.8em;
            margin-bottom: 5px;
        }

        .stat-card p {
            opacity: 0.9;
            font-size: 0.85em;
        }

        .week-container {
            margin-bottom: 25px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            overflow: hidden;
        }

        .week-header {
            background: #343a40;
            color: white;
            padding: 12px 15px;
            font-weight: 600;
            font-size: 1em;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .phase-badge {
            background: rgba(255,255,255,0.2);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.85em;
        }

        .runs-list {
            background: white;
        }

        /* Desktop/Laptop View */
        .run-item.desktop-view {
            padding: 15px;
            border-bottom: 1px solid #e9ecef;
            display: grid;
            grid-template-columns: 40px 80px 100px 100px 80px 120px 1fr 250px 140px;
            gap: 15px;
            align-items: center;
            cursor: move;
            transition: all 0.3s;
        }

        .run-item.completed {
            opacity: 0.6;
            background: #e8f5e9;
        }

        .run-item.completed.desktop-view {
            text-decoration: line-through;
        }

        /* Mobile/iPhone View */
        .run-item.mobile-view {
            padding: 15px;
            border-bottom: 1px solid #e9ecef;
            display: flex;
            flex-direction: column;
            gap: 10px;
            cursor: move;
            transition: all 0.3s;
        }

        .mobile-view .mobile-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .mobile-view .mobile-main {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .mobile-view .mobile-full {
            grid-column: 1 / -1;
        }

        .run-item:hover {
            background: #f8f9fa;
        }

        .run-item.completed:hover {
            background: #c8e6c9;
        }

        .run-item.dragging {
            opacity: 0.5;
            background: #e9ecef;
        }

        .run-item.drag-over {
            border-top: 3px solid #667eea;
        }

        .run-item:last-child {
            border-bottom: none;
        }

        .run-item.race {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
        }

        .run-item.race:hover {
            background: #ffeaa7;
        }

        .run-item.race.completed {
            background: #fffacd;
        }

        .day-badge {
            background: #667eea;
            color: white;
            padding: 8px 12px;
            border-radius: 5px;
            text-align: center;
            font-weight: 600;
            font-size: 0.85em;
            cursor: pointer;
            white-space: nowrap;
        }

        .day-badge:hover {
            background: #764ba2;
        }

        .run-type {
            font-weight: 600;
            color: #495057;
            font-size: 0.95em;
        }

        .distance {
            color: #667eea;
            font-weight: 600;
            font-size: 0.95em;
            cursor: pointer;
        }

        .distance:hover {
            text-decoration: underline;
        }

        .run-time {
            color: #28a745;
            font-weight: 600;
            font-size: 0.9em;
        }

        .run-time-label {
            font-size: 0.75em;
            color: #6c757d;
            display: block;
        }

        .pace {
            color: #6c757d;
            font-size: 0.85em;
            margin-bottom: 5px;
        }

        .notes {
            color: #495057;
            font-size: 0.85em;
            line-height: 1.4;
        }

        .terrain {
            color: #6c757d;
            font-size: 0.8em;
            line-height: 1.3;
        }

        .date-display {
            color: #495057;
            font-size: 0.85em;
            cursor: pointer;
        }

        .date-display:hover {
            color: #667eea;
            text-decoration: underline;
        }

        .actions {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }

        .actions button {
            padding: 5px 10px;
            font-size: 0.85em;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 10px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-content h2 {
            margin-bottom: 20px;
            color: #343a40;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #495057;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ced4da;
            border-radius: 5px;
            font-size: 14px;
        }

        .form-group textarea {
            min-height: 80px;
            resize: vertical;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-actions button {
            flex: 1;
        }

        .export-section {
            margin-top: 25px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            text-align: center;
        }

        .drag-handle {
            cursor: move;
            color: #6c757d;
            font-size: 1.2em;
        }

        .details-column {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .hidden {
            display: none !important;
        }

        .completion-badge {
            background: #28a745;
            color: white;
            padding: 3px 10px;
            border-radius: 15px;
            font-size: 0.75em;
            font-weight: bold;
            margin-left: 10px;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.5em;
            }

            .controls {
                padding: 10px;
            }

            .stat-card h3 {
                font-size: 1.5em;
            }
        }
    
            .control-btn {
            background: #ffc107 !important;
            color: #333 !important;
            border: 1px solid #e0a800;
        }
        .control-btn:hover {
            background: #e0a800 !important;
        }
        .content.is-locked {
            opacity: 0.35;
            pointer-events: none;
            filter: grayscale(0.6);
        }
        .controls.is-locked {
            pointer-events: auto;
            opacity: 1;
        }</style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏃‍♂️ Training Plan Manager</h1>
                        <p style="font-size:0.9em; margin-top:10px;">Complete tracking + Mobile view + Run times</p>
        </div>

        <div class="view-toggle">
            <button id="laptopBtn" class="active" onclick="switchView('laptop')">💻 Laptop View</button>
            <button id="mobileBtn" onclick="switchView('mobile')">📱 Mobile View</button>
            <button id="showCompletedBtn" class="active" onclick="toggleShowCompleted()">👁️ Show Completed</button>
        </div>

        <div class="controls">
            <div class="control-group">
                <label>Phase:</label>
                <select id="phaseFilter">
                    <option value="all">All</option>
                </select>
            </div>

            <div class="control-group">
                <label>Type:</label>
                <select id="typeFilter">
                    <option value="all">All</option>
                </select>
            </div>

            <div class="control-group">
                <label>Search:</label>
                <input type="text" id="searchBox" placeholder="Search...">
            </div>

            <button onclick="resetFilters()">Reset</button>
            <button class="secondary" onclick="exportToCSV()">📥 CSV</button>
            <button class="secondary" onclick="saveToLocalStorage()">💾 Save</button>
                        <button id="lockToggleBtn" class="control-btn" onclick="toggleLock()">🔓 Unlocked</button>
        </div>

        <div class="content">
            <div class="stats" id="statsContainer"></div>
            <div id="weeksContainer"></div>

            <div class="export-section">
                <h3>DEV v2 - Final Pre-Production Test</h3>
                <p>✅ Mark runs complete • 👁️ Hide/show completed • 📱 Mobile friendly • ⏱️ Time estimates</p>
                <p style="margin-top:10px; font-size:0.9em;">Changes save to separate DEV storage. Original version untouched!</p>
            </div>
        </div>
    </div>

    <div id="editModal" class="modal">
        <div class="modal-content">
            <h2>Edit Run</h2>
            <form id="editForm">
                <div class="form-group">
                    <label>Day of Week:</label>
                    <select id="editDay">
                        <option value="Mon">Monday</option>
                        <option value="Tue">Tuesday</option>
                        <option value="Wed">Wednesday</option>
                        <option value="Thu">Thursday</option>
                        <option value="Fri">Friday</option>
                        <option value="Sat">Saturday</option>
                        <option value="Sun">Sunday</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Date:</label>
                    <input type="date" id="editDate">
                </div>

                <div class="form-group">
                    <label>Run Type:</label>
                    <input type="text" id="editType">
                </div>

                <div class="form-group">
                    <label>Distance (km):</label>
                    <input type="number" id="editDistance" step="any" min="0">
                </div>

                <div class="form-group">
                    <label>Distance (miles):</label>
                    <input type="number" id="editDistanceMiles" step="any" min="0">
                </div>

                <div class="form-group">
                    <label>Pace:</label>
                    <input type="text" id="editPace" placeholder="e.g., 6:15-6:50/km">
                </div>

                <div class="form-group">
                    <label>Terrain:</label>
                    <input type="text" id="editTerrain">
                </div>

                <div class="form-group">
                    <label>Notes:</label>
                    <textarea id="editNotes"></textarea>
                </div>

                <div class="modal-actions">
                    <button type="submit" class="secondary">Save Changes</button>
                    <button type="button" onclick="closeModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

        function calculateRunTime(paceStr, distanceKm) {
            if (!paceStr || paceStr === '-' || !distanceKm) {
                return { min: null, max: null };
            }

            try {
                if (paceStr.includes('-') && paceStr.includes('/km')) {
                    const paceRange = paceStr.replace('/km', '').trim();
                    const parts = paceRange.split('-');

                    const paceToMinutes = (pace) => {
                        const [mins, secs] = pace.trim().split(':');
                        return parseFloat(mins) + parseFloat(secs) / 60;
                    };

                    const minPace = paceToMinutes(parts[0]);
                    const maxPace = paceToMinutes(parts[1]);

                    const minTime = minPace * parseFloat(distanceKm);
                    const maxTime = maxPace * parseFloat(distanceKm);

                    return { min: minTime, max: maxTime };
                }
            } catch (e) {
                return { min: null, max: null };
            }

            return { min: null, max: null };
        }

            if (hours > 0) {

            }
            return `${mins}m`;
        }

        function handleDragOver(e) {
            if (e.preventDefault) {
                e.preventDefault();
            }
            e.target.closest('.run-item')?.classList.add('drag-over');
            e.dataTransfer.dropEffect = 'move';
            return false;
        }

        function handleDrop(e) {
            if (e.stopPropagation) {
                e.stopPropagation();
            }

            const dropTarget = e.target.closest('.run-item');
            if (dropTarget && draggedElement !== dropTarget) {
                const dropIndex = parseInt(dropTarget.dataset.index);

                const temp = trainingData[draggedIndex];
                trainingData[draggedIndex] = trainingData[dropIndex];
                trainingData[dropIndex] = temp;

                const draggedWeek = trainingData[draggedIndex].Week;
                const dropWeek = trainingData[dropIndex].Week;
                trainingData[draggedIndex].Week = dropWeek;
                trainingData[dropIndex].Week = draggedWeek;

                saveToLocalStorage();
                renderWeeks();
                updateStats();
            }

            return false;
        }

        function handleDragEnd(e) {

            const dayDiff = (days.indexOf(newDay) - currentIdx + 7) % 7;
            date.setDate(date.getDate() + dayDiff);
            run.Date = date.toISOString();

                if (parts.length === 3) {

                    run.Date = date.toISOString();

                    const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
                    run.Day = days[date.getDay()];

                    saveToLocalStorage();
                    renderWeeks();

            }

        function quickEditDistance(index) {
            const run = trainingData[index];
            const currentKm = parseFloat(run.Distance_km) || 0;
            const currentMi = (currentKm * 0.621371).toFixed(1);

            const unit = prompt(`Enter distance:\n- In km (e.g., "15" or "15 km")\n- In miles (e.g., "10 mi")\n\nCurrent: ${currentKm} km / ${currentMi} mi`, currentKm + ' km');

            if (unit) {
                let value;
                const trimmed = unit.trim().toLowerCase();

                if (trimmed.endsWith('mi') || trimmed.endsWith('miles')) {
                    const milesMatch = trimmed.match(/([\d.]+)/);
                    if (milesMatch) {
                        const miles = parseFloat(milesMatch[1]);
                        value = miles / 0.621371;
                    }
                } else {
                    const kmMatch = trimmed.match(/([\d.]+)/);
                    if (kmMatch) {
                        value = parseFloat(kmMatch[1]);
                    }
                }

                if (value !== undefined && !isNaN(value)) {
                    run.Distance_km = value.toFixed(1);
                    saveToLocalStorage();
                    renderWeeks();
                    updateStats();
                }
            }

            const year = date.getFullYear();
            return `${day}/${month}/${year}`;

            const date = new Date(dateValue);
            run.Date = date.toISOString();

            run['Run.1'] = document.getElementById('editType').value;

            const kmValue = parseFloat(document.getElementById('editDistance').value);
            run.Distance_km = kmValue.toFixed(1);

            run.Pace = document.getElementById('editPace').value;
            run.Terrain = document.getElementById('editTerrain').value;
            run.Notes = document.getElementById('editNotes').value;

            saveToLocalStorage();
            closeModal();
            renderWeeks();
            updateStats();
        });

        let isUpdatingKm = false;
        let isUpdatingMiles = false;

        document.getElementById('editDistance').addEventListener('input', function(e) {
            if (isUpdatingKm) return;

            const km = parseFloat(e.target.value);
            if (!isNaN(km) && km >= 0) {
                isUpdatingMiles = true;
                const miles = km * 0.621371;
                document.getElementById('editDistanceMiles').value = miles.toFixed(2);
                isUpdatingMiles = false;
            }
        });

        document.getElementById('editDistanceMiles').addEventListener('input', function(e) {
            if (isUpdatingMiles) return;

            const mi = parseFloat(e.target.value);
            if (!isNaN(mi) && mi >= 0) {
                isUpdatingKm = true;
                const km = mi / 0.621371;
                document.getElementById('editDistance').value = km.toFixed(2);
                isUpdatingKm = false;
            }
        });

        document.getElementById('editDate').addEventListener('change', function(e) {
            const date = new Date(e.target.value);
            const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            document.getElementById('editDay').value = days[date.getDay()];
        });

        function resetFilters() {
            document.getElementById('phaseFilter').value = 'all';
            document.getElementById('typeFilter').value = 'all';
            document.getElementById('searchBox').value = '';
            renderWeeks();
        }

        function exportToCSV() {
            const headers = Object.keys(trainingData[0]);
            const csv = [
                headers.join(','),
                ...trainingData.map(row => 
                    headers.map(header => {
                        const value = row[header];
                        if (header === 'Date') {
                            return formatDateFull(value);
                        }
                        return typeof value === 'string' && value.includes(',') ? `"${value}"` : value;
                    }).join(',')
                )
            ].join('\n');

            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'training_plan_DEV_v2.csv';
            a.click();
        }

        document.getElementById('phaseFilter').addEventListener('change', renderWeeks);
        document.getElementById('typeFilter').addEventListener('change', renderWeeks);
        document.getElementById('searchBox').addEventListener('input', renderWeeks);

        document.getElementById('editModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });

        updateStats();
        populateFilters();
        renderWeeks();

        // === EXTREME PATCH 3: LOCK SYSTEM ===
    const STORAGE_KEY_HASH = 'plan_pin_hash';
    const STORAGE_KEY_LOCKED = 'plan_locked';
    let isLocked = false;

    async function sha256(pin) {
        const encoder = new TextEncoder();
        const data = encoder.encode(pin);
        const hashBuffer = await crypto.subtle.digest('SHA-256', data);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function initLockSystem() {
        const storedHash = localStorage.getItem(STORAGE_KEY_HASH);
        const storedLocked = localStorage.getItem(STORAGE_KEY_LOCKED);
        isLocked = storedLocked === 'true';

        // Mapping: .edit-run-section -> .content (the editing area)
        const editArea = document.querySelector('.content');
        const btn = document.getElementById('lockToggleBtn');

        function applyLockUI() {
            if (editArea) {
                if (isLocked) {
                    editArea.classList.add('is-locked');
                    document.querySelector('.controls').classList.add('is-locked');
                    if (btn) btn.textContent = '🔒 Locked';
                } else {
                    editArea.classList.remove('is-locked');
                    document.querySelector('.controls').classList.remove('is-locked');
                    if (btn) btn.textContent = '🔓 Unlocked';
                }
            }
        }

        function setPinAndLock(pin) {
            sha256(pin).then(hash => {
                localStorage.setItem(STORAGE_KEY_HASH, hash);
                isLocked = true;
                localStorage.setItem(STORAGE_KEY_LOCKED, 'true');
                applyLockUI();
            });
        }

        // Toggle lock/unlock
        window.toggleLock = async function() {
            const btn = document.getElementById('lockToggleBtn');
            if (!isLocked) {
                // Lock it
                if (!storedHash) {
                    const pin = prompt('Set a PIN to lock the plan (stored as SHA-256 hash):');
                    if (pin) setPinAndLock(pin);
                } else {
                    isLocked = true;
                    localStorage.setItem(STORAGE_KEY_LOCKED, 'true');
                    applyLockUI();
                }
            } else {
                // Unlock it
                const pin = prompt('Enter PIN to unlock:');
                if (pin && storedHash) {
                    const pinHash = await sha256(pin);
                    if (pinHash === storedHash) {
                        isLocked = false;
                        localStorage.setItem(STORAGE_KEY_LOCKED, 'false');
                        applyLockUI();
                    } else {
                        alert('Incorrect PIN');
                    }
                }
            }
        };

        // Apply initial state
        applyLockUI();
    }

    // === EXTREME PATCH 4: DOMContentLoaded hook ===
    document.addEventListener('DOMContentLoaded', initLockSystem);

</script>
