<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultra Training Plan · 2026</title>
    <style>
        /* [Keep your existing CSS here - ensuring no syntax errors] */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: sans-serif; background: #f4f4f9; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; }
        .run-item { padding: 10px; border: 1px solid #ddd; margin-bottom: 5px; cursor: move; }
        .completed { background: #e8f5e9; opacity: 0.7; }
    </style>
</head>
<body>

<div class="container">
    <h1>🏔️ 2026 Ultra Plan</h1>
    <div id="weeksContainer"></div>
</div>

<script>
    // 1. DATA
    const trainingData = [
        {Week:2,Run:5,Date:"2026-05-25",Day:"Mon",Phase:"Recovery","Run.1":"Zone 2",Distance_km:10,Pace:"6:15/km",Notes:"Recovery",completed:false},
        {Week:3,Run:9,Date:"2026-06-01",Day:"Mon",Phase:"Base","Run.1":"Zone 2",Distance_km:12,Pace:"6:15/km",Notes:"Base",completed:false}
        // ... (Add your remaining array items here, ensuring closing brackets/commas are correct)
    ];

    // 2. DRAG AND DROP HANDLERS
    let draggedIndex = null;

    function handleDragStart(e) {
        draggedIndex = e.target.getAttribute('data-index');
    }

    function handleDragOver(e) {
        e.preventDefault();
    }

    function handleDrop(e) {
        e.preventDefault();
        const targetIndex = e.target.closest('.run-item').getAttribute('data-index');
        // Logic to reorder array based on indices
        renderWeeks();
    }

    // 3. PERSISTENCE
    function saveData() {
        localStorage.setItem('ultraPlanData', JSON.stringify(trainingData));
    }

    function markComplete(idx) {
        trainingData[idx].completed = !trainingData[idx].completed;
        saveData();
        renderWeeks();
    }

    // 4. RENDERER
    function renderWeeks() {
        const container = document.getElementById('weeksContainer');
        container.innerHTML = '';
        
        trainingData.forEach((run, idx) => {
            const div = document.createElement('div');
            div.className = `run-item ${run.completed ? 'completed' : ''}`;
            div.setAttribute('draggable', 'true');
            div.setAttribute('data-index', idx);
            div.ondragstart = handleDragStart;
            div.ondragover = handleDragOver;
            div.ondrop = handleDrop;
            
            div.innerHTML = `
                <strong>${run.Date}</strong> - ${run["Run.1"]} (${run.Distance_km}km)
                <button onclick="markComplete(${idx})">${run.completed ? 'Undo' : 'Done'}</button>
            `;
            container.appendChild(div);
        });
    }

    // Initialize
    renderWeeks();
</script>
</body>
</html>
